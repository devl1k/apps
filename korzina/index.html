<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Корзина</title>
<meta name="theme-color" content="#3B4FD8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: one column (max 880px). Accent hero with the balance, month metrics, fixed bottom tab bar, forms in a bottom sheet with a pinned action bar. */
:root{
  --bg:#F1F3F8; --surface:#FFFFFF; --surface-2:#F5F6FA; --ink:#101827; --muted:#596378; --line:#DCE0EA;
  --accent:#3B4FD8; --accent-ink:#FFFFFF; --accent-soft:#E6E9FC;
  --income:#12805C; --income-soft:#DDF3EA; --expense:#C8402B; --expense-soft:#FBE4DF; --warn:#8A5A00; --warn-soft:#FFF1D1;
  --p0:#3B4FD8; --p1:#B4540A; --p2:#0E7C86; --p3:#8B3FD1; --p4:#C2257A; --p5:#6B7A12;
  --shadow:0 1px 2px rgba(16,24,39,.06),0 6px 20px rgba(16,24,39,.06);
  --font-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Unbounded','Onest',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D111A; --surface:#151A26; --surface-2:#1B2130; --ink:#E9EDF6; --muted:#9AA4BA; --line:#262D3E;
    --accent:#8FA0FF; --accent-ink:#0D111A; --accent-soft:#222A4D;
    --income:#4CC58F; --income-soft:#143328; --expense:#FF8C75; --expense-soft:#3A1E19; --warn:#F2B84B; --warn-soft:#3A2D10;
    --p0:#8FA0FF; --p1:#F0A25C; --p2:#4FC3CE; --p3:#C497F0; --p4:#F27DB5; --p5:#B9CB4A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D111A; --surface:#151A26; --surface-2:#1B2130; --ink:#E9EDF6; --muted:#9AA4BA; --line:#262D3E;
  --accent:#8FA0FF; --accent-ink:#0D111A; --accent-soft:#222A4D;
  --income:#4CC58F; --income-soft:#143328; --expense:#FF8C75; --expense-soft:#3A1E19; --warn:#F2B84B; --warn-soft:#3A2D10;
  --p0:#8FA0FF; --p1:#F0A25C; --p2:#4FC3CE; --p3:#C497F0; --p4:#F27DB5; --p5:#B9CB4A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
h2,h3{text-wrap:balance}
.app{max-width:880px;margin:0 auto;padding-block:12px 150px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.top .r{display:flex;gap:8px}
.pbtn{appearance:none;display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:40px;max-width:100%;min-width:0;font:600 15px var(--font-body);cursor:pointer}
.pbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pbtn svg{width:16px;height:16px;flex:none;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:380px){.grid2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card h3{font:600 15px var(--font-body);margin-bottom:4px}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.02em}
.s{font-size:13px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.grow{flex:1}

.hero{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:20px 18px}
.hero .lbl{color:inherit;opacity:.8}
.hero-num{font:600 clamp(28px,8vw,40px)/1.15 var(--font-display);letter-spacing:-.02em;margin:6px 0 8px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hero-sub{font-size:14px;opacity:.92}
.hero-sub b{font-weight:700}
.hero-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hero-act .btn{background:rgba(0,0,0,.14);color:inherit;border-color:transparent}
.reserve{background:var(--warn-soft);border:1px solid var(--warn);border-radius:16px;padding:16px;color:var(--ink)}
.reserve .lbl{color:var(--warn);font-weight:600}
.reserve-num{font:600 28px/1.2 var(--font-display);margin:4px 0;color:var(--warn);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.mswitch{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mswitch .mt{font:600 15px var(--font-display);text-align:center;flex:1}
.icon-btn{appearance:none;background:var(--surface);border:1px solid var(--line);width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.icon-btn[disabled]{opacity:.4;cursor:default}
.icon-btn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.icon-btn svg{width:20px;height:20px}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;padding:10px 14px;border-radius:10px;cursor:pointer;min-height:42px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--expense)}
.btn.small{padding:6px 10px;min-height:34px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.link{appearance:none;background:none;border:0;padding:0;font-weight:600;color:var(--accent);cursor:pointer;text-align:left}

.metric .v{font:600 20px/1.25 var(--font-display);font-variant-numeric:tabular-nums;margin:4px 0 2px;overflow-wrap:anywhere}
.metric .v.in{color:var(--income)} .metric .v.out{color:var(--expense)}
.bar{display:flex;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.bar .f{background:var(--c)}
.bar .p{background:repeating-linear-gradient(135deg,var(--c) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 1px var(--c)}
.bar.exp{--c:var(--expense)} .bar.inc{--c:var(--income)} .bar.acc{--c:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend .f{background:var(--c)} .legend .p{background:repeating-linear-gradient(135deg,var(--c) 0 2px,transparent 2px 4px);box-shadow:inset 0 0 0 1px var(--c)}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.rowmain{display:flex;flex:1;min-width:0;align-items:center;gap:12px;background:none;border:0;padding:4px 0;text-align:left;cursor:pointer;min-height:48px}
.rowmain .tx{flex:1;min-width:0}
.rowmain .t{font-weight:600;overflow-wrap:anywhere}
.amt-c{display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.amt-c .sub{font-size:11px;color:var(--muted);font-weight:500}
.a{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.a.in{color:var(--income)} .a.out{color:var(--expense)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c);border:2px solid var(--c)}
.dot.hollow{background:transparent}
.dot.in{--c:var(--income)} .dot.out{--c:var(--expense)}
.chip{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid transparent;margin-left:6px;vertical-align:1px;white-space:nowrap}
.chip.fact{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.chip.plan{background:var(--accent-soft);color:var(--accent)}
.chip.late{background:var(--expense-soft);color:var(--expense)}
.chip.ok{background:var(--income-soft);color:var(--income)}
.chip.rep{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.who{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);margin-left:6px;vertical-align:1px;white-space:nowrap}
.who::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--muted))}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--muted)}

.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;appearance:none;border:0;background:transparent;padding:8px 10px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;min-height:38px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button.on.exp{color:var(--expense)} .seg button.on.inc{color:var(--income)}
.seg button .pd{width:8px;height:8px;border-radius:50%;background:var(--c)}

.cal{display:flex;flex-direction:column;gap:4px}
.cal .hd,.cal .wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wk{position:relative}
.cal .wk .c{min-height:calc(54px + var(--ln,0)*21px)}
.wkb{position:absolute;left:0;right:0;top:46px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));column-gap:4px;grid-auto-rows:18px;row-gap:3px;pointer-events:none}
.rb{pointer-events:auto;appearance:none;border:0;padding:0;margin:0;height:18px;position:relative;display:grid;grid-template-columns:repeat(var(--k,1),minmax(0,1fr));column-gap:4px;background:none;cursor:pointer;min-width:0;color:var(--ink);font:600 11px var(--font-body);text-align:left}
.rb .sg{margin:0 4px;background:color-mix(in srgb,var(--c) 28%,var(--surface));border-radius:4px}
.rb .sg.s{border-radius:9px 4px 4px 9px} .rb .sg.e{border-radius:4px 9px 9px 4px} .rb .sg.s.e{border-radius:9px}
.rb.in{--c:var(--income)} .rb.out{--c:var(--expense)}
.rb .lb{position:absolute;left:12px;right:12px;top:0;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.rb .lb.ml{left:25px} .rb .lb.mr{right:25px}
.rb .mk{position:absolute;top:5px;width:8px;height:8px;border-radius:50%;background:var(--c);pointer-events:none}
.rb .mk.l{left:12px} .rb .mk.r{right:12px}
.cal .h{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.cal .c{position:relative;appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:50px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;font-size:13px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums;color:var(--ink)}
.cal .c .dn{line-height:20px}
.cal button.c:hover{border-color:var(--muted)}
.cal .c.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal .c.sel{background:var(--accent-soft)}
.cal .c.none{color:var(--muted);cursor:default;font-weight:400;background:transparent;border-color:var(--line)}
.cal .c.win{background:var(--surface-2);cursor:default}
.cal .c.today{outline:2px solid var(--accent);outline-offset:-1px}
.cal .gap{visibility:hidden}
.cal .ds{display:flex;gap:3px;min-height:7px;align-items:center}
.d{width:7px;height:7px;border-radius:50%;background:var(--c);border:1.5px solid var(--c)}
.d.hollow{background:transparent}
.d.in{--c:var(--income)} .d.out{--c:var(--expense)}
.lgbar{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 22%,var(--surface))}
.lgbar.in{--c:var(--income)} .lgbar.out{--c:var(--expense)}
.legend i.lgbar{width:14px;height:14px;border-radius:4px;margin-right:5px;vertical-align:-2px}
.legend i.lgpt{width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.sync-st{font-size:13px;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.sync-st.bad{color:var(--expense)}
.sync-box{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px}
.sync-box textarea{min-height:64px;resize:vertical;font:12px/1.3 ui-monospace,monospace}
.lgpt{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--muted);vertical-align:0;margin-right:5px}
.daylist{display:flex;flex-direction:column;gap:8px}
.daygrp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:2px 14px 4px;transition:background .6s,border-color .6s;scroll-margin-top:12px}
.daygrp.hl{background:var(--accent-soft);border-color:var(--accent)}
.daygrp.past{opacity:.78}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0 2px}
.dayhead .dd{font-weight:700;font-size:16px}
.dayhead .wd{color:var(--muted);font-weight:500;margin-left:8px;font-size:13px}
.drow{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.dayhead+.drow{border-top:0}
.chk{appearance:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--c);background:transparent;flex:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:var(--surface)}
.chk.in{--c:var(--income)} .chk.out{--c:var(--expense)}
.chk.on{background:var(--c)}
.chk svg{width:16px;height:16px;stroke-width:3}
.dmain{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;cursor:pointer;min-height:44px}
.dmain .tx{flex:1;min-width:0}
.dmain .t{font-weight:600;overflow-wrap:anywhere;display:block}
.dmain .s2{display:block;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.drow.done .t{color:var(--muted)}
.drow.done .a{opacity:.65}
.wn::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c,var(--muted));margin-right:4px}
.fold{padding:12px 16px}
.foldh{appearance:none;background:none;border:0;padding:0;width:100%;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;min-height:32px}
.foldh .ft{font:600 15px var(--font-body);flex:1;min-width:0}
.foldh .fh{font-size:12px;color:var(--muted);text-align:right;min-width:0}
.chev{width:18px;height:18px;transition:transform .2s;color:var(--muted);flex:none}
.chev.up{transform:rotate(180deg)}
.foldb{margin-top:10px}
.dayhead .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.dayhead .r b{font-variant-numeric:tabular-nums;font-size:14px}
.dayhead .r .lbl{font-variant-numeric:tabular-nums}

.rec.off{opacity:.65}
.rec-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.rec-bot{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.rec-bot .btns{display:flex;gap:6px}
.pcard{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.pcard:first-of-type{border-top:0;padding-top:4px}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
.pgrid b{display:block;font-variant-numeric:tabular-nums}

.tablewrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;min-width:680px;font-variant-numeric:tabular-nums}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:right;padding:8px;white-space:nowrap}
td{padding:10px 8px;text-align:right;border-top:1px solid var(--line);white-space:nowrap;vertical-align:top}
th:first-child,td:first-child{text-align:left}
td .sub{display:block;font-size:11px;color:var(--muted)}
tr.cur td{background:var(--accent-soft)}
.chartwrap{overflow-x:auto}
.chartwrap svg{display:block;min-width:600px;width:100%;height:auto}
svg .gl{stroke:var(--line);stroke-width:1}
svg .tx{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
svg .now{fill:var(--accent-soft)}
svg .b.in{fill:var(--income)} svg .b.ex{fill:var(--expense)}
svg .b.p.in{fill:url(#hi);stroke:var(--income);stroke-width:1}
svg .b.p.ex{fill:url(#he);stroke:var(--expense);stroke-width:1}

.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:12px;color:var(--muted)}
input[type=text],input[type=date],input[type=password],input:not([type]),select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;min-width:0;font-size:16px}
input[type=date]{-webkit-appearance:none;appearance:none;display:block}
textarea{min-height:110px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.field.big input{font:600 26px var(--font-display);padding:12px 14px;padding-right:48px}
.amt{position:relative}
.amt i{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:18px;pointer-events:none}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:420px){.row2{grid-template-columns:minmax(0,1fr)}}
.inl{display:flex;gap:8px}
.inl input{flex:1}
.hint{font-size:12px;color:var(--muted);min-height:0}
.hint:empty{display:none}
.check{display:flex;gap:10px;align-items:center;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.err{color:var(--expense);font-size:13px}
.err:empty{display:none}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.catchip{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px}
.catchip button{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;width:26px;height:26px;border-radius:50%;line-height:1;font-size:16px}
.catadd{display:flex;gap:8px}
.set-sec{display:flex;flex-direction:column;gap:12px}
.pers{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
@media (max-width:520px){.pers{grid-template-columns:auto minmax(0,1fr) auto}.pers .st{grid-column:2/4;order:5}}
.sw{width:14px;height:14px;border-radius:50%;background:var(--c);margin-bottom:15px;border:0;padding:0;cursor:pointer;box-shadow:0 0 0 3px var(--surface-2)}
.keyrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.keyrow:first-of-type{border-top:0}
kbd{font:600 12px ui-monospace,Menlo,Consolas,monospace;background:var(--surface-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:3px 8px;white-space:nowrap}
.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;background:var(--surface-2)}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--ink)}

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d);
const todayISO=()=>{const d=new Date();return iso(d.getFullYear(),d.getMonth()+1,d.getDate())};
const dim=(y,m)=>new Date(y,m,0).getDate();
const ym=s=>s.slice(0,7);
const addM=(k,n)=>{const p=k.split('-').map(Number);const t=p[0]*12+p[1]-1+n;return Math.floor(t/12)+'-'+pad(t%12+1)};
const addD=(s,n)=>{const p=s.split('-').map(Number);const t=new Date(p[0],p[1]-1,p[2]+n);return iso(t.getFullYear(),t.getMonth()+1,t.getDate())};
const MN=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD=['вс','пн','вт','ср','чт','пт','сб'];
const monthTitle=k=>{const p=k.split('-').map(Number);const n=MN[p[1]-1];return n.charAt(0).toUpperCase()+n.slice(1)+' '+p[0]};
const dowOf=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).getDay()};
const fmtShort=s=>{const p=s.split('-').map(Number);return p[2]+' '+MG[p[1]-1]};
const fmtLong=s=>fmtShort(s)+', '+WD[dowOf(s)];
const fmtRange=(a,b)=>{if(!b||b<=a) return fmtShort(a);if(ym(a)===ym(b)) return Number(a.slice(8))+'–'+Number(b.slice(8))+' '+MG[Number(a.slice(5,7))-1];return fmtShort(a)+' – '+fmtShort(b)};
const nf0=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0});
const nf2=new Intl.NumberFormat('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
const cur=()=>state.settings.currency||'₽';
const r2=v=>Math.round((Number(v)||0)*100)/100;
function nfm(v){v=Math.abs(r2(v));return (Number.isInteger(v)?nf0:nf2).format(v)}
function money(v,sign){v=r2(v);return (v<0?'−':(sign&&v>0?'+':''))+nfm(v)+' '+cur()}
const rangeTxt=(lo,hi)=>nfm(lo)+'–'+nfm(hi)+' '+cur();
const parseAmount=s=>{const n=Number(String(s).replace(/[\s ]/g,'').replace(',','.'));return isFinite(n)&&String(s).trim()!==''?n:NaN};
function parseRange(s){
  s=String(s==null?'':s).trim(); if(!s) return null;
  const m=s.match(/^(.+?)\s*(?:[-–—−]|\.\.\.?|…|до)\s*(.+)$/i);
  if(m){let a=parseAmount(m[1]),b=parseAmount(m[2]);if(isFinite(a)&&isFinite(b)){if(a>b){const t=a;a=b;b=t}return {lo:a,hi:b}}return null}
  const a=parseAmount(s);return isFinite(a)?{lo:a,hi:a}:null;
}
const rangeInput=(lo,hi)=>{lo=Number(lo)||0;hi=Number(hi);return lo?(hi>lo?lo+'–'+hi:String(lo)):''};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const clone=o=>JSON.parse(JSON.stringify(o));
const ICONS={left:'<path d="M15 18l-6-6 6-6"/>',right:'<path d="M9 18l6-6-6-6"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>'};
const ic=n=>'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+ICONS[n]+'</svg>';
async function pool(items,fn,n){const q=items.slice();const w=Array.from({length:Math.min(n||6,q.length)},async()=>{while(q.length){await fn(q.shift())}});await Promise.all(w)}


let fs=null;
/* ---------- toast & sheet ---------- */
let toastT=0;
function toast(msg,o){
  const t=$('#toast');
  t.innerHTML='<span>'+esc(msg)+'</span>'+(o&&o.undo?'<button type="button" data-act="undo">Отменить</button>':'')+(o&&o.redo?'<button type="button" data-act="redo">Вернуть</button>':'');
  t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},(o&&(o.undo||o.redo))?7000:3200);
}
let Draft=null,histDepth=0,histBusy=false,histT=0;
const DRAFT_KINDS=['item','entry','pack','hist','cat','profile','op','rec','debt','sched','pay','occ','debt-pay'];
const fsKey=()=>fs&&DRAFT_KINDS.indexOf(fs.kind)>=0?fs.kind+':'+(fs.id||fs.key||('new'+(fs.type||fs.dir||''))):'';
function openSheet(title,body,bar,focusId){
  const key=fsKey();
  $('#sheet-h').innerHTML='<h2 id="sheet-title">'+title+'</h2><button class="icon-btn" type="button" data-act="close" aria-label="Закрыть">'+ic('x')+'</button>';
  $('#sheet-b').innerHTML=body;$('#sheet-f').innerHTML=bar||'';$('#sheet-b').scrollTop=0;
  if(Draft){
    if(key&&Draft.key===key){
      $('#sheet-h').innerHTML=Draft.title;$('#sheet-b').innerHTML=Draft.body;$('#sheet-f').innerHTML=Draft.bar;
      try{Object.assign(fs,JSON.parse(Draft.fs))}catch(e){}
    }
    Draft=null;
  }
  $('#modal').hidden=false;
  reconcileHist();
  const f=focusId&&$('#'+focusId);if(f&&!matchMedia('(pointer:coarse)').matches) setTimeout(()=>f.focus(),30);
}
function serializeSheet(){
  const b=$('#sheet-b');
  b.querySelectorAll('input,textarea,select').forEach(el=>{
    if(el.tagName==='SELECT'){[...el.options].forEach(o=>{if(o.selected) o.setAttribute('selected','');else o.removeAttribute('selected')})}
    else if(el.tagName==='TEXTAREA') el.textContent=el.value;
    else if(el.type==='checkbox'||el.type==='radio'){if(el.checked) el.setAttribute('checked','');else el.removeAttribute('checked')}
    else el.setAttribute('value',el.value);
  });
  return b.innerHTML;
}
function hideSheet(){
  if($('#modal').hidden) return;
  const k=fsKey();
  if(k&&$('#sheet-b').querySelector('input,textarea,select')){
    try{Draft={key:k,title:$('#sheet-h').innerHTML,body:serializeSheet(),bar:$('#sheet-f').innerHTML,fs:JSON.stringify(fs)}}catch(e){Draft=null}
  }
  const d=Draft;closeSheet(true);Draft=d;
}
function closeSheet(keep){
  $('#modal').hidden=true;$('#sheet-b').innerHTML='';$('#sheet-f').innerHTML='';fs=null;if(!keep) Draft=null;
  setTimeout(reconcileHist,0);
}
/* системная кнопка «назад» закрывает окно: на время открытого окна в истории лежит одна служебная запись */
function reconcileHist(){
  if(histBusy) return;
  const open=!$('#modal').hidden;
  if(open&&histDepth===0){try{history.pushState({sheet:1},'');histDepth=1}catch(e){}}
  else if(!open&&histDepth===1){histBusy=true;clearTimeout(histT);histT=setTimeout(()=>{histBusy=false;histDepth=0},800);try{history.back()}catch(e){histBusy=false;histDepth=0}}
}
window.addEventListener('popstate',()=>{
  if(histBusy){histBusy=false;histDepth=0;clearTimeout(histT);reconcileHist();return}
  if(histDepth===1){histDepth=0;if(!$('#modal').hidden) hideSheet()}
});
function twoStep(el,label,fn){
  if(el.dataset.arm){fn();return}
  el.dataset.arm='1';const old=el.textContent;el.textContent=label;
  setTimeout(()=>{if(el.isConnected){delete el.dataset.arm;el.textContent=old}},3500);
}
async function copyText(t,okMsg){
  let p;try{p=navigator.clipboard.writeText(t)}catch(e){p=Promise.reject(e)}
  p.then(()=>toast(okMsg||'Скопировано'),()=>toast('Не удалось скопировать. Выделите текст вручную.'));
}

const keyOf=a=>prefs.keys[a.id]||a.def;
function comboFromEvent(e){
  if(/^(Control|Shift|Alt|Meta)(Left|Right)$/.test(e.code)||!e.code) return '';
  const code=e.code==='NumpadEnter'?'Enter':e.code;
  return ((e.ctrlKey||e.metaKey)?'Ctrl+':'')+(e.altKey?'Alt+':'')+(e.shiftKey?'Shift+':'')+code;
}
function comboLabel(c){
  return c.split('+').map(p=>{
    if(/^Key[A-Z]$/.test(p)) return p.slice(3);
    if(/^Digit\d$/.test(p)) return p.slice(5);
    const m={ArrowLeft:'←',ArrowRight:'→',ArrowUp:'↑',ArrowDown:'↓',Slash:'/',Space:'Пробел',Escape:'Esc',Comma:',',Period:'.',BracketLeft:'[',BracketRight:']'};

}

function estimate(){
  const s=state.settings,today=todayISO(),buys=mainBuys().filter(b=>b.date&&b.date<=today);
  const res={ok:false,src:'',ess:0,wish:0,rare:0,essM:0,wishM:0,rareM:0,days:0,n:0,span:0,rows:[],top:[]};
  let first=today;buys.forEach(b=>{if(b.date<first) first=b.date});
  const span=buys.length?ddays(first,today)+1:0,W=Math.max(1,Math.min(span||1,60)),from=addD(today,-(W-1));
  const per=new Map();let n=0;
  buys.forEach(b=>{if(b.date<from) return;const a=per.get(b.itemId)||{sum:0,cnt:0,name:b.name};a.sum+=Number(b.sum)||0;a.cnt++;per.set(b.itemId,a);n++});
  const histOk=span>=14&&n>=8;

  const rows=[];let nh=0,nd=0;

    const it=state.items.get(id),h=per.get(id);
    if(it&&it.noEst) return;
    let g=it?grpOf(it):'ess';if(g==='off') return;
    const fm=(it&&it.fm)||'auto',fr=it?Number(it.freq)||0:0,cnt=h?h.cnt:0;

    if(g!=='rare'&&g!=='off'){const sm=it&&it.eg&&it.eg!=='tag';
      if(!sm&&((src==='decl'&&fr>0&&fr<=0.7)||(src==='hist'&&cnt===1&&W>=60)||(src==='hist'&&rareIv(id)>=45))) g='rare'}
    rows.push({id,n:it?it.name:h.name,g,m:r2(m),cnt,src,fr,noPrice:!(m>0)});

  return res;
}

function weeklyChart(metric){
  const today=todayISO(),buys=mainBuys().filter(b=>b.date&&b.date<=today);
  if(!buys.length) return '';
  let from=ui.period==='all'?buys.reduce((a,b)=>b.date<a?b.date:a,today):addD(today,-Number(ui.period)+1);
  const cap=addD(today,-181);if(from<cap) from=cap;
  const bk=[];for(let w=wkStart(from),end=wkStart(today);w<=end;w=addD(w,7)) bk.push({w,ess:0,wish:0,rare:0,off:0});
  const idx=new Map(bk.map((b,i)=>[b.w,i]));
  buys.forEach(b=>{if(b.date<from) return;const i=idx.get(wkStart(b.date));if(i==null) return;const it=state.items.get(b.itemId),g=it?grpOf(it):'ess';bk[i][g]=(bk[i][g]||0)+(metric==='sum'?(Number(b.sum)||0):1)});
  const tot=bk.map(b=>b.ess+b.wish+b.rare+b.off),max=Math.max.apply(null,tot.concat([1]));
  const n=bk.length,W=340,H=150,pb=22,pt=16,gap=n>13?4:6,bw=Math.max(5,Math.floor((W-gap*(n+1))/n)),fmt=v=>metric==='sum'?(v>=10000?Math.round(v/1000)+'к':v>=1000?(Math.round(v/100)/10).toString().replace('.',',')+'к':String(Math.round(v))):String(v);

  bk.forEach((b,i)=>{
    const x=gap+i*(bw+gap);let y=H-pb;
    ['ess','wish','rare','off'].forEach(g=>{const v=b[g];if(!v) return;const h=Math.max(2,v/max*(H-pb-pt));y-=h;svg+='<rect x="'+x+'" y="'+r2(y)+'" width="'+bw+'" height="'+r2(h)+'" rx="3" fill="'+col[g]+'"/>'});

    const step=n>14?4:n>8?2:1;if(i%step===0||i===n-1&&step===1) svg+='<text x="'+(x+bw/2)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+dshort(b.w)+'</text>';
  });

}

function h53(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}

function syncSave(){try{if(Sync.cfg) localStorage.setItem(SYNC_KEY,JSON.stringify({cfg:Sync.cfg,m:Sync.m,last:Sync.last,bh:Sync.bh}));else localStorage.removeItem(SYNC_KEY)}catch(e){}}
function syncDocs(){
  const out=new Map();out.set('sh:settings|s',{c:'sh:settings',i:'s',d:state.settings});
  KINDS.forEach(k=>state[k].forEach(o=>out.set('sh:'+k+'|'+o.id,{c:'sh:'+k,i:o.id,d:o})));
  return out;
}
function syncScan(){
  if(!Sync.cfg) return;
  const docs=syncDocs(),now=Date.now();let ch=false;
  docs.forEach((v,k)=>{const hh=h53(JSON.stringify(v.d)),e=Sync.m[k];if(!e||e[0]!==hh||e[2]){Sync.m[k]=[hh,now,0,1];ch=true}});
  for(const k in Sync.m){if(!docs.has(k)&&!Sync.m[k][2]){Sync.m[k]=[Sync.m[k][0],now,1,1];ch=true}}
  if(ch||Sync.bh!==h53(JSON.stringify(shopSummary()))){syncSave();syncKick()}
}
function syncKick(){if(!Sync.cfg) return;if(Sync.busy){Sync.again=true;return}clearTimeout(Sync.t);Sync.t=setTimeout(syncRun,1200)}
async function syncCall(fn,body){
  const c=Sync.cfg,hd={'Content-Type':'application/json',apikey:c.k};
  if(/^eyJ/.test(c.k)) hd.Authorization='Bearer '+c.k;
  const r=await fetch(c.u.replace(/\/+$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:hd,body:JSON.stringify(body)});
  if(!r.ok){let t='';try{const j=await r.json();t=j.message||j.hint||''}catch(e){}throw new Error(t||('Ошибка '+r.status))}
  return r.json();
}
function syncApply(rows,quiet){
  let touched=false;const maxS=rows.reduce((a,r)=>Math.max(a,r.s),Sync.last);
  for(const r of rows){
    if(r.c==='bridge'){if(r.i==='fin'){state.bridge=(r.x||!r.d)?null:Object.assign({},r.d,{u:r.u});touched=true}continue}
    if(r.c.slice(0,3)!=='sh:') continue;
    const kind=r.c.slice(3),k=r.c+'|'+r.i,e=Sync.m[k];
    if(e&&e[1]>=r.u) continue;
    if(kind==='settings'){if(!r.x&&r.d){state.settings=normSettings(r.d);Sync.m[k]=[h53(JSON.stringify(state.settings)),r.u,0,0];touched=true}continue}
    if(KINDS.indexOf(kind)<0) continue;
    touched=true;
    if(r.x||!r.d){state[kind].delete(r.i);Sync.m[k]=['',r.u,1,0]}
    else{const o=Object.assign({},r.d,{id:r.i});state[kind].set(r.i,o);Sync.m[k]=[h53(JSON.stringify(o)),r.u,0,0]}
  }
  Sync.last=maxS;
  if(touched){persistLocal();if(!quiet){renderHeader();schedule()}}
}
async function syncRun(){
  if(!Sync.cfg||Sync.busy) return;
  clearTimeout(Sync.t);Sync.busy=true;Sync.err='';syncUI();
  try{
    const rows=await syncCall('kassa_pull',{p_room:Sync.cfg.r,p_since:Sync.last});
    if(rows.length) syncApply(rows);
    const keys=Object.keys(Sync.m).filter(k=>Sync.m[k][3]),docs=syncDocs();
    for(let i=0;i<keys.length;i+=100){
      const part=keys.slice(i,i+100),sent={};
      const payload=part.map(k=>{const e=Sync.m[k],j=k.indexOf('|'),v=docs.get(k);sent[k]=e[1];return {c:k.slice(0,j),i:k.slice(j+1),d:e[2]?null:(v?v.d:null),u:e[1],x:!!e[2]}});
      await syncCall('kassa_push',{p_room:Sync.cfg.r,p_rows:payload});
      part.forEach(k=>{if(Sync.m[k]&&Sync.m[k][1]===sent[k]) Sync.m[k][3]=0});
    }
    const sum=shopSummary(),bh=h53(JSON.stringify(sum));
    if(bh!==Sync.bh){const u=Date.now();await syncCall('kassa_push',{p_room:Sync.cfg.r,p_rows:[{c:'bridge',i:'shop',d:Object.assign({},sum,{u}),u,x:false}]});Sync.bh=bh}
    Sync.at=Date.now();syncSave();
  }catch(e){
    Sync.err=(e&&e.message)||'нет соединения';
    if(/Failed to fetch|NetworkError|Load failed/i.test(Sync.err)) Sync.err='нет соединения с интернетом';
    else if(/Could not find the function|schema cache/i.test(Sync.err)) Sync.err='база не подготовлена. Выполните SQL из «Финансов» в Supabase';
    else if(/Invalid API key|JWT/i.test(Sync.err)) Sync.err='неверный ключ';
  }
  Sync.busy=false;syncUI();
  if(Sync.again){Sync.again=false;syncKick()}
}
function syncTimers(){
  if(Sync.timers) return;Sync.timers=true;
  setInterval(()=>{if(!document.hidden) syncRun()},20000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden) syncRun()});
  window.addEventListener('online',()=>syncRun());
}
function syncUI(){if(ui.tab==='settings') schedule()}
function syncInit(){syncLoad();if(Sync.cfg){syncTimers();syncScan();syncRun()}}
function syncCode(c){return 'MK1.'+btoa(unescape(encodeURIComponent(JSON.stringify({u:c.u,k:c.k,r:c.r}))))}
function syncParse(t){try{t=String(t||'').trim();if(!/^MK1\./.test(t)) return null;const j=JSON.parse(decodeURIComponent(escape(atob(t.slice(4)))));return j&&j.u&&j.k&&j.r&&String(j.r).length>=16?{u:String(j.u),k:String(j.k),r:String(j.r)}:null}catch(e){return null}}

      Persist.settings(s=>{s.catIcons=Object.assign({},s.catIcons);
        let arr=old?s.cats.map(c=>c===old?nm:c):s.cats.concat([nm]);if(old&&old!==nm) delete s.catIcons[old];
        const pos=parseInt(pos0,10);if(pos>=1&&pos<=arr.length){arr=arr.filter(c=>c!==nm);arr.splice(pos-1,0,nm)}
        s.cats=arr;s.catIcons[nm]=ic0});

  'est-toggle'(el){const it=state.items.get(el.dataset.id);if(!it) return;commit(it.noEst?'Товар снова учитывается':'Товар не учитывается в оценке',()=>Persist.put('items',Object.assign({},it,{noEst:!it.noEst})),{quiet:true})},
  cut(el){const id=el.dataset.id;commit('Убрано из списка',()=>Persist.del('list',id))},
  'cut-all'(el){const ids=String(el.dataset.ids||'').split(',').filter(Boolean);commit('Убрано из списка: '+ids.length,()=>ids.forEach(id=>Persist.del('list',id)))},

    syncPackFields();const name=fs.name.trim();if(!name) return ($('#p-err').textContent='Введите название пака.');
    const old=fs.id?state.packs.get(fs.id):null,o={id:old?old.id:uid(),name,items:fs.items.filter(x=>state.items.has(x.id))};

  'pack-list-sheet'(){syncPackFields();const id=fs.id;closeSheet();addPackToList(id)},
  't-period'(el){ui.period=el.dataset.v;render(true)},'t-metric'(el){ui.metric=el.dataset.v;render(true)},
  mode(el){commit('Названия: '+(modes().find(m=>m[0]===el.dataset.v)||['','Альт.'])[1],()=>Persist.settings(s=>{s.nameMode=el.dataset.v}),{quiet:true});render(true)},
  'names-toggle'(){
    const cur=state.settings.nameMode;
    commit(cur==='normal'?'Смешные названия':'Обычные названия',()=>Persist.settings(s=>{s.nameMode=cur==='normal'?(prefs.lastFunny||'f0'):'normal';if(cur!=='normal') prefs.lastFunny=cur}),{quiet:true});
    toast(state.settings.nameMode==='normal'?'Обычные названия':'Смешные названия');render(true);
  },
  'price-toggle'(){prefs.prices=!prefs.prices;savePrefs();toast(prefs.prices?'Цены показаны':'Цены скрыты');render(true)},
  'cat-add'(){const i=$('#cat-add'),v=i.value.trim();if(!v) return;if(state.settings.cats.includes(v)) return toast('Такая категория уже есть');commit('Категория добавлена',()=>Persist.settings(s=>{s.cats.push(v)}),{quiet:true});render(true);const n=$('#cat-add');if(n) n.focus()},
  'cat-del'(el){const n=el.dataset.n;commit('Категория удалена',()=>Persist.settings(s=>{s.cats=s.cats.filter(c=>c!==n)}),{quiet:true});ui.cats.delete(n);render(true)},
  'tag-add'(){const i=$('#tag-add'),v=i.value.trim();if(!v) return;commit('Метка добавлена',()=>Persist.settings(s=>{s.tags.push({id:uid(),name:v,c:s.tags.length%6})}),{quiet:true});render(true);const n=$('#tag-add');if(n) n.focus()},
  'tag-del'(el){const id=el.dataset.id;if(state.settings.tags.length<2) return toast('Нужна хотя бы одна метка');commit('Метка удалена',()=>Persist.settings(s=>{s.tags=s.tags.filter(t=>t.id!==id)}),{quiet:true});ui.tags.delete(id);render(true)},
  'store-add'(){const i=$('#store-add'),v=i.value.trim();if(!v) return;if([...state.stores.values()].some(s=>norm(s.name)===norm(v))) return toast('Такой магазин уже есть');commit('Магазин добавлен',()=>Persist.put('stores',{id:uid(),name:v}),{quiet:true});render(true);const n=$('#store-add');if(n) n.focus()},
  'store-del'(el){const id=el.dataset.id;ui.stores.delete(id);commit('Магазин удалён',()=>{[...state.items.values()].forEach(it=>{if((it.prices&&id in it.prices)||it.store===id){const n=Object.assign({},it,{prices:Object.assign({},it.prices||{}),store:it.store===id?'':it.store});delete n.prices[id];Persist.put('items',n)}});[...state.list.values()].forEach(e=>{if(e.store===id) Persist.put('list',Object.assign({},e,{store:''}))});Persist.del('stores',id)});if(ui.store===id) ui.store='';render(true)},
  'key-set'(el){ui.capturing=ui.capturing===el.dataset.id?null:el.dataset.id;render(true)},
  'keys-reset'(){prefs.keys={};savePrefs();toast('Горячие клавиши сброшены');render(true)},
  export(){doExport()},
  'pick-file'(){$('#imp-file').click()},
  'import-do'(el){
    const j=fs&&fs.j;if(!j) return;const replace=el.dataset.m==='replace';closeSheet();
    commit(replace?'Данные заменены':'Данные добавлены',()=>{
      if(replace) wipeAll();
      if(j.settings) Persist.settings(s=>Object.assign(s,normSettings(j.settings)));
      KINDS.forEach(k=>(j[k]||[]).filter(o=>o&&o.id).forEach(o=>Persist.put(k,o)));
    },{quiet:true});
    toast('Импорт завершён');render(true);
  },
  demo(){loadDemo()},
  wipe(el){twoStep(el,'Точно удалить всё?',()=>{commit('Все данные удалены',()=>wipeAll());render(true)})},
  help(){openHelp()},
  async 'sync-join'(){
    const c=syncParse($('#sy-code').value);if(!c) return toast('Код не распознан. Скопируйте его целиком в «Финансах».');
    const prev=Sync.cfg;Sync.cfg=c;let rows;
    try{rows=await syncCall('kassa_pull',{p_room:c.r,p_since:0})}catch(e){Sync.cfg=prev;return toast('Не получилось: '+((e&&e.message)||'нет соединения'))}
    Sync.m={};Sync.last=0;
    if(!state.items.size&&!state.packs.size&&!state.list.size&&!state.stores.size) syncDocs().forEach((v,k)=>{Sync.m[k]=[h53(JSON.stringify(v.d)),0,0,0]});
    syncApply(rows,true);Sync.err='';syncSave();syncTimers();flushLocal();toast('Подключено');render(true);syncRun();
  },
  'sync-now'(){syncRun()},
  'sync-force'(){if(!Sync.cfg) return;const now=Date.now();syncScan();Object.keys(Sync.m).forEach(k=>{Sync.m[k][1]=now;Sync.m[k][3]=1});Sync.bh='';syncSave();toast('Отправляю всё с этого устройства…');syncRun()},
  'sync-code'(){copyText(syncCode(Sync.cfg),'Код скопирован')},
  'sync-off'(el){twoStep(el,'Отключить? Данные останутся здесь и в облаке',()=>{Sync.cfg=null;Sync.m={};Sync.last=0;Sync.err='';clearTimeout(Sync.t);syncSave();toast('Синхронизация отключена');render(true)})}
};
/* ---------- events ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled) return;const f=act[el.dataset.act];if(f) f(el,e)});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){const was=!!ui.q;ui.q=t.value;ui.limit=100;if(prefs.iview==='blocks'&&(was!==!!ui.q)){render(true);const q=$('#q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}else refreshCatalog()}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='b-cols'){prefs.bcols=el.value;savePrefs();render(true);return}
  if(el.id==='b-sort'){prefs.bsort=el.value;savePrefs();render(true);return}
  if(el.id==='b-hide'){prefs.bhide=el.checked;savePrefs();render(true);return}
  if(el.id==='erase-sel'){ui.eraseSel=el.value;return}
  if(el.id==='fk-on'){const bx=$('#fk-box');if(bx) bx.hidden=!el.checked;return}
  if(el.id==='imp-file'){const f=el.files&&el.files[0];el.value='';handleFile(f);return}
  if(el.dataset&&el.dataset.sn){const v=el.value.trim(),s=state.stores.get(el.dataset.sn);if(s&&v&&v!==s.name) commit('Магазин переименован',()=>Persist.put('stores',Object.assign({},s,{name:v})),{quiet:true});else if(s) el.value=s.name;return}
  if(el.dataset&&el.dataset.tg){const id=el.dataset.tg,v=el.value;commit('Метка изменена',()=>Persist.settings(s=>{const t=s.tags.find(x=>x.id===id);if(t) t.grp=v}),{quiet:true});syncKick();return}
  if(el.dataset&&el.dataset.set){
    const k=el.dataset.set;let v=el.type==='checkbox'?el.checked:el.value;
    if(k==='budget'||k==='manualEss'||k==='manualWish'){v=String(v).trim()===''?0:parseAmount(v);if(!isFinite(v)||v<0){toast('Сумма введена неверно');v=0}}
    commit('Настройки изменены',()=>Persist.settings(s=>{s[k]=v}),{quiet:true});
    if(k==='toFin'||k==='useFin'||k==='manualEss'||k==='manualWish'||k==='manualFirst') syncKick();
    render(true);
  }
});
/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(ui.capturing){
    e.preventDefault();e.stopPropagation();
    if(e.code==='Escape'){ui.capturing=null;render(true);return}
    const c=comboFromEvent(e);if(!c) return;
    const cur2=ACTIONS.find(x=>x.id===ui.capturing),ctx=cur2.ctx||'page';
    const other=ACTIONS.find(a=>a.id!==ui.capturing&&(a.ctx||'page')===ctx&&keyOf(a)===c);
    if(other){toast('Это сочетание занято: '+other.label);return}
    if(c===cur2.def) delete prefs.keys[cur2.id];else prefs.keys[cur2.id]=c;
    savePrefs();ui.capturing=null;toast('Сохранено: '+comboLabel(c));render(true);return;
  }
  const modalOpen=!$('#modal').hidden,t=e.target,tag=(t&&t.tagName)||'';
  const inField=t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(tag));
  const c=comboFromEvent(e);
  if(modalOpen){
    if(e.key==='Enter'&&t&&t.id==='i-funny-in'){e.preventDefault();addFunny();return}
    if(e.key==='Escape'){closeSheet();return}
    const prim=$('#sheet [data-primary]');
    const saveKey=c&&ACTIONS.some(a=>a.ctx==='modal'&&keyOf(a)===c)&&!/^(BUTTON|TEXTAREA|A)$/.test(tag);
    if(prim&&(c==='Ctrl+Enter'||saveKey)){e.preventDefault();prim.click()}
    return;
  }
  if(e.key==='Enter'&&t&&t.id==='q-add'){e.preventDefault();quickAdd();return}
  if(e.key==='Enter'&&t&&/^(cat|tag|store)-add$/.test(t.id||'')){e.preventDefault();const b=t.parentNode.querySelector('[data-act$="-add"]');if(b) b.click();return}
  if(e.key==='Escape'&&inField&&t.id==='q'){t.blur();return}
  if(inField||!c) return;
  if((c==='Enter'||c==='Space')&&/^(BUTTON|A|SUMMARY)$/.test(tag)) return;
  const a=ACTIONS.find(x=>(x.ctx||'page')==='page'&&keyOf(x)===c);if(!a) return;
  e.preventDefault();
  if(a.tab) return setTab(a.tab);
  const run={
    add:()=>act.add(),quick:()=>{setTab('list');setTimeout(()=>{const i=$('#q-add');if(i) i.focus()},30)},
    search:()=>{setTab('items');setTimeout(()=>{const i=$('#q');if(i) i.focus()},30)},
    undo,redo,prices:()=>act['price-toggle'](),names:()=>act['names-toggle'](),
    selmode:()=>{setTab('items');act['sel-mode']()},selall:()=>{if(ui.tab==='items'){ui.selMode=true;act['sel-all']()}},
    short:()=>act['short-add'](),clear:()=>act['clear-done'](),export:()=>doExport(),import:()=>$('#imp-file').click(),help:()=>openHelp(),
    tabPrev:()=>setTab(TABS[(TABS.indexOf(ui.tab)+TABS.length-1)%TABS.length]),tabNext:()=>setTab(TABS[(TABS.indexOf(ui.tab)+1)%TABS.length])
  };
  (run[a.id]||(()=>{}))();
});
/* drag and drop import */
(function(){
  let depth=0;const ov=$('#dropall');
  const hasFiles=e=>e.dataTransfer&&[...(e.dataTransfer.types||[])].indexOf('Files')>=0;
  window.addEventListener('dragenter',e=>{if(!hasFiles(e)) return;e.preventDefault();depth++;ov.hidden=false});
  window.addEventListener('dragover',e=>{if(!hasFiles(e)) return;e.preventDefault()});
  window.addEventListener('dragleave',e=>{if(!hasFiles(e)) return;depth=Math.max(0,depth-1);if(!depth) ov.hidden=true});
  window.addEventListener('drop',e=>{if(!hasFiles(e)) return;e.preventDefault();depth=0;ov.hidden=true;const f=e.dataTransfer.files&&e.dataTransfer.files[0];handleFile(f)});
})();
loadPrefs();if(prefs.tab&&TABS.indexOf(prefs.tab)>=0) ui.tab=prefs.tab;
loadLocal();syncInit();render();
(function(){const y=(prefs.scr||{})[ui.tab]||0;if(y){requestAnimationFrame(()=>window.scrollTo(0,y));setTimeout(()=>window.scrollTo(0,y),300)}
  let st=0;window.addEventListener('scroll',()=>{clearTimeout(st);st=setTimeout(()=>{prefs.scr=prefs.scr||{};prefs.scr[ui.tab]=Math.round(window.scrollY);savePrefs()},250)},{passive:true})})();

})();
</script>
