<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Финансы</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
.grip{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;flex:none;cursor:grab;touch-action:none;color:var(--muted);font-size:20px;line-height:1;user-select:none;-webkit-user-select:none;border-radius:8px}
.grip:active{cursor:grabbing}.dragging{position:relative;z-index:50;opacity:.9;box-shadow:0 8px 24px rgba(0,0,0,.45)}.dropto{outline:2px dashed var(--accent);outline-offset:-2px}
.catrows{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.catrow{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:2px 6px 2px 2px}
.catrow .cn{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow .mini{appearance:none;border:0;background:transparent;color:var(--muted);width:34px;height:34px;border-radius:8px;font-size:16px;cursor:pointer}

/* Layout: one column (max 880px). Accent hero with the balance, month metrics, fixed bottom tab bar, forms in a bottom sheet with a pinned action bar. */
:root{
  --bg:#F1F3F8; --surface:#FFFFFF; --surface-2:#F5F6FA; --ink:#101827; --muted:#596378; --line:#DCE0EA;
  --accent:#3B4FD8; --accent-ink:#FFFFFF; --accent-soft:#E6E9FC;
  --income:#12805C; --income-soft:#DDF3EA; --expense:#C8402B; --expense-soft:#FBE4DF; --warn:#8A5A00; --warn-soft:#FFF1D1;
  --p0:#3B4FD8; --p1:#B4540A; --p2:#0E7C86; --p3:#8B3FD1; --p4:#C2257A; --p5:#6B7A12;
  --shadow:0 1px 2px rgba(16,24,39,.06),0 6px 20px rgba(16,24,39,.06);
  --font-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Unbounded','Onest',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D111A; --surface:#151A26; --surface-2:#1B2130; --ink:#E9EDF6; --muted:#9AA4BA; --line:#262D3E;
    --accent:#8FA0FF; --accent-ink:#0D111A; --accent-soft:#222A4D;
    --income:#4CC58F; --income-soft:#143328; --expense:#FF8C75; --expense-soft:#3A1E19; --warn:#F2B84B; --warn-soft:#3A2D10;
    --p0:#8FA0FF; --p1:#F0A25C; --p2:#4FC3CE; --p3:#C497F0; --p4:#F27DB5; --p5:#B9CB4A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D111A; --surface:#151A26; --surface-2:#1B2130; --ink:#E9EDF6; --muted:#9AA4BA; --line:#262D3E;
  --accent:#8FA0FF; --accent-ink:#0D111A; --accent-soft:#222A4D;
  --income:#4CC58F; --income-soft:#143328; --expense:#FF8C75; --expense-soft:#3A1E19; --warn:#F2B84B; --warn-soft:#3A2D10;
  --p0:#8FA0FF; --p1:#F0A25C; --p2:#4FC3CE; --p3:#C497F0; --p4:#F27DB5; --p5:#B9CB4A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
h2,h3{text-wrap:balance}
.app{max-width:880px;margin:0 auto;padding-block:12px 150px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.top .r{display:flex;gap:8px}
.pbtn{appearance:none;display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:40px;max-width:100%;min-width:0;font:600 15px var(--font-body);cursor:pointer}
.pbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pbtn svg{width:16px;height:16px;flex:none;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:380px){.grid2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card h3{font:600 15px var(--font-body);margin-bottom:4px}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.02em}
.s{font-size:13px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.grow{flex:1}

.hero{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:20px 18px}
.hero .lbl{color:inherit;opacity:.8}
.hero-num{font:600 clamp(28px,8vw,40px)/1.15 var(--font-display);letter-spacing:-.02em;margin:6px 0 8px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hero-sub{font-size:14px;opacity:.92}
.hero-sub b{font-weight:700}
.hero-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hero-act .btn{background:rgba(0,0,0,.14);color:inherit;border-color:transparent}
.reserve{background:var(--warn-soft);border:1px solid var(--warn);border-radius:16px;padding:16px;color:var(--ink)}
.reserve .lbl{color:var(--warn);font-weight:600}
.reserve-num{font:600 28px/1.2 var(--font-display);margin:4px 0;color:var(--warn);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.mswitch{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mswitch .mt{font:600 15px var(--font-display);text-align:center;flex:1}
.icon-btn{appearance:none;background:var(--surface);border:1px solid var(--line);width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.icon-btn[disabled]{opacity:.4;cursor:default}
.icon-btn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.icon-btn svg{width:20px;height:20px}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;padding:10px 14px;border-radius:10px;cursor:pointer;min-height:42px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--expense)}
.btn.small{padding:6px 10px;min-height:34px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.link{appearance:none;background:none;border:0;padding:0;font-weight:600;color:var(--accent);cursor:pointer;text-align:left}

.metric .v{font:600 20px/1.25 var(--font-display);font-variant-numeric:tabular-nums;margin:4px 0 2px;overflow-wrap:anywhere}
.metric .v.in{color:var(--income)} .metric .v.out{color:var(--expense)}
.bar{display:flex;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.bar .f{background:var(--c)}
.bar .p{background:repeating-linear-gradient(135deg,var(--c) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 1px var(--c)}
.bar.exp{--c:var(--expense)} .bar.inc{--c:var(--income)} .bar.acc{--c:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend .f{background:var(--c)} .legend .p{background:repeating-linear-gradient(135deg,var(--c) 0 2px,transparent 2px 4px);box-shadow:inset 0 0 0 1px var(--c)}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.rowmain{display:flex;flex:1;min-width:0;align-items:center;gap:12px;background:none;border:0;padding:4px 0;text-align:left;cursor:pointer;min-height:48px}
.rowmain .tx{flex:1;min-width:0}
.rowmain .t{font-weight:600;overflow-wrap:anywhere}
.amt-c{display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.amt-c .sub{font-size:11px;color:var(--muted);font-weight:500}
.a{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.a.in{color:var(--income)} .a.out{color:var(--expense)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c);border:2px solid var(--c)}
.dot.hollow{background:transparent}
.dot.in{--c:var(--income)} .dot.out{--c:var(--expense)}
.chip{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid transparent;margin-left:6px;vertical-align:1px;white-space:nowrap}
.chip.fact{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.chip.plan{background:var(--accent-soft);color:var(--accent)}
.chip.late{background:var(--expense-soft);color:var(--expense)}
.chip.ok{background:var(--income-soft);color:var(--income)}
.chip.rep{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.who{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);margin-left:6px;vertical-align:1px;white-space:nowrap}
.who::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--muted))}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--muted)}

.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;appearance:none;border:0;background:transparent;padding:8px 10px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;min-height:38px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button.on.exp{color:var(--expense)} .seg button.on.inc{color:var(--income)}
.seg button .pd{width:8px;height:8px;border-radius:50%;background:var(--c)}

.cal{display:flex;flex-direction:column;gap:4px}
.cal .hd,.cal .wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wk{position:relative}
.cal .wk .c{min-height:calc(54px + var(--ln,0)*21px)}
.wkb{position:absolute;left:0;right:0;top:46px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));column-gap:4px;grid-auto-rows:18px;row-gap:3px;pointer-events:none}
.rb{pointer-events:auto;appearance:none;border:0;padding:0;margin:0;height:18px;position:relative;display:grid;grid-template-columns:repeat(var(--k,1),minmax(0,1fr));column-gap:4px;background:none;cursor:pointer;min-width:0;color:var(--ink);font:600 11px var(--font-body);text-align:left}
.rb .sg{margin:0 4px;background:color-mix(in srgb,var(--c) 28%,var(--surface));border-radius:4px}
.rb .sg.s{border-radius:9px 4px 4px 9px} .rb .sg.e{border-radius:4px 9px 9px 4px} .rb .sg.s.e{border-radius:9px}
.rb.in{--c:var(--income)} .rb.out{--c:var(--expense)}
.rb .lb{position:absolute;left:12px;right:12px;top:0;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.rb .lb.ml{left:25px} .rb .lb.mr{right:25px}
.rb .mk{position:absolute;top:5px;width:8px;height:8px;border-radius:50%;background:var(--c);pointer-events:none}
.rb .mk.l{left:12px} .rb .mk.r{right:12px}
.cal .h{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.cal .c{position:relative;appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:50px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;font-size:13px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums;color:var(--ink)}
.cal .c .dn{line-height:20px}
.cal button.c:hover{border-color:var(--muted)}
.cal .c.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal .c.sel{background:var(--accent-soft)}
.cal .c.none{color:var(--muted);cursor:default;font-weight:400;background:transparent;border-color:var(--line)}
.cal .c.win{background:var(--surface-2);cursor:default}
.cal .c.today{outline:2px solid var(--accent);outline-offset:-1px}
.cal .gap{visibility:hidden}
.cal .ds{display:flex;gap:3px;min-height:7px;align-items:center}
.d{width:7px;height:7px;border-radius:50%;background:var(--c);border:1.5px solid var(--c)}
.d.hollow{background:transparent}
.d.in{--c:var(--income)} .d.out{--c:var(--expense)}
.lgbar{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 22%,var(--surface))}
.lgbar.in{--c:var(--income)} .lgbar.out{--c:var(--expense)}
.legend i.lgbar{width:14px;height:14px;border-radius:4px;margin-right:5px;vertical-align:-2px}
.legend i.lgpt{width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.sync-st{font-size:13px;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.sync-st.bad{color:var(--expense)}
.sync-box{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px}
.sync-box textarea{min-height:64px;resize:vertical;font:12px/1.3 ui-monospace,monospace}
.lgpt{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--muted);vertical-align:0;margin-right:5px}
.daylist{display:flex;flex-direction:column;gap:8px}
.daygrp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:2px 14px 4px;transition:background .6s,border-color .6s;scroll-margin-top:12px}
.daygrp.hl{background:var(--accent-soft);border-color:var(--accent)}
.daygrp.past{opacity:.78}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0 2px}
.dayhead .dd{font-weight:700;font-size:16px}
.dayhead .wd{color:var(--muted);font-weight:500;margin-left:8px;font-size:13px}
.drow{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.dayhead+.drow{border-top:0}
.chk{appearance:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--c);background:transparent;flex:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:var(--surface)}
.chk.in{--c:var(--income)} .chk.out{--c:var(--expense)}
.chk.on{background:var(--c)}
.chk svg{width:16px;height:16px;stroke-width:3}
.dmain{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;cursor:pointer;min-height:44px}
.dmain .tx{flex:1;min-width:0}
.dmain .t{font-weight:600;overflow-wrap:anywhere;display:block}
.dmain .s2{display:block;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.drow.done .t{color:var(--muted)}
.drow.done .a{opacity:.65}
.wn::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c,var(--muted));margin-right:4px}
.fold{padding:12px 16px}
.foldh{appearance:none;background:none;border:0;padding:0;width:100%;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;min-height:32px}
.foldh .ft{font:600 15px var(--font-body);flex:1;min-width:0}
.foldh .fh{font-size:12px;color:var(--muted);text-align:right;min-width:0}
.chev{width:18px;height:18px;transition:transform .2s;color:var(--muted);flex:none}
.chev.up{transform:rotate(180deg)}
.foldb{margin-top:10px}
.dayhead .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.dayhead .r b{font-variant-numeric:tabular-nums;font-size:14px}
.dayhead .r .lbl{font-variant-numeric:tabular-nums}

.rec.off{opacity:.65}
.rec-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.rec-bot{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.rec-bot .btns{display:flex;gap:6px}
.pcard{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.pcard:first-of-type{border-top:0;padding-top:4px}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
.pgrid b{display:block;font-variant-numeric:tabular-nums}

.tablewrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;min-width:680px;font-variant-numeric:tabular-nums}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:right;padding:8px;white-space:nowrap}
td{padding:10px 8px;text-align:right;border-top:1px solid var(--line);white-space:nowrap;vertical-align:top}
th:first-child,td:first-child{text-align:left}
td .sub{display:block;font-size:11px;color:var(--muted)}
tr.cur td{background:var(--accent-soft)}
.chartwrap{overflow-x:auto}
.chartwrap svg{display:block;min-width:600px;width:100%;height:auto}
svg .gl{stroke:var(--line);stroke-width:1}
svg .tx{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
svg .now{fill:var(--accent-soft)}
svg .b.in{fill:var(--income)} svg .b.ex{fill:var(--expense)}
svg .b.p.in{fill:url(#hi);stroke:var(--income);stroke-width:1}
svg .b.p.ex{fill:url(#he);stroke:var(--expense);stroke-width:1}

.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:12px;color:var(--muted)}
input[type=text],input[type=date],input[type=password],input:not([type]),select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;min-width:0;font-size:16px}
input[type=date]{-webkit-appearance:none;appearance:none;display:block}
textarea{min-height:110px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.field.big input{font:600 26px var(--font-display);padding:12px 14px;padding-right:48px}
.amt{position:relative}
.amt i{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:18px;pointer-events:none}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:420px){.row2{grid-template-columns:minmax(0,1fr)}}
.inl{display:flex;gap:8px}
.inl input{flex:1}
.hint{font-size:12px;color:var(--muted);min-height:0}
.hint:empty{display:none}
.check{display:flex;gap:10px;align-items:center;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.err{color:var(--expense);font-size:13px}
.err:empty{display:none}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.catchip{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px}
.catchip button{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;width:26px;height:26px;border-radius:50%;line-height:1;font-size:16px}
.catadd{display:flex;gap:8px}
.set-sec{display:flex;flex-direction:column;gap:12px}
.pers{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}

.sw{width:14px;height:14px;border-radius:50%;background:var(--c);margin-bottom:15px;border:0;padding:0;cursor:pointer;box-shadow:0 0 0 3px var(--surface-2)}

.prog{margin-top:10px}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-in{max-width:880px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}
.nav button{appearance:none;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;font-size:10.5px;font-weight:600;cursor:pointer;min-height:52px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--accent);background:var(--accent-soft)}
.fab{position:fixed;z-index:21;right:max(16px,calc((100vw - 880px)/2 + 16px));bottom:calc(80px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px rgba(20,30,90,.35);display:flex;align-items:center;justify-content:center;cursor:pointer}
.fab svg{width:26px;height:26px;stroke-width:2.2}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(10,14,24,.55)}
.sheet{position:relative;width:100%;max-width:520px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:var(--surface);border-radius:20px 20px 0 0;overscroll-behavior:contain}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 10px}
.sheet-h h2{font:600 18px var(--font-display);min-width:0;overflow-wrap:anywhere}
.sheet-b{overflow-y:auto;padding:4px 16px 14px;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.sheet-f{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);border-radius:0}
.sheet-f:empty{display:none}
@media (min-width:640px){.modal{align-items:center}.sheet{border-radius:20px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:calc(100vw - 32px);display:flex;gap:10px;align-items:center}
.toast button{appearance:none;border:0;background:rgba(127,127,127,.25);color:inherit;font-weight:700;border-radius:8px;padding:6px 12px;cursor:pointer;min-height:34px}
.onb{max-width:520px;margin:4vh auto 0}
.onb h1{font:600 26px/1.2 var(--font-display);letter-spacing:-.02em;margin:8px 0 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d);
const todayISO=()=>{const d=new Date();return iso(d.getFullYear(),d.getMonth()+1,d.getDate())};
const dim=(y,m)=>new Date(y,m,0).getDate();
const ym=s=>s.slice(0,7);
const addM=(k,n)=>{const p=k.split('-').map(Number);const t=p[0]*12+p[1]-1+n;return Math.floor(t/12)+'-'+pad(t%12+1)};
const addD=(s,n)=>{const p=s.split('-').map(Number);const t=new Date(p[0],p[1]-1,p[2]+n);return iso(t.getFullYear(),t.getMonth()+1,t.getDate())};
const MN=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD=['вс','пн','вт','ср','чт','пт','сб'];
const monthTitle=k=>{const p=k.split('-').map(Number);const n=MN[p[1]-1];return n.charAt(0).toUpperCase()+n.slice(1)+' '+p[0]};
const dowOf=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).getDay()};
const fmtShort=s=>{const p=s.split('-').map(Number);return p[2]+' '+MG[p[1]-1]};
const fmtLong=s=>fmtShort(s)+', '+WD[dowOf(s)];
const fmtRange=(a,b)=>{if(!b||b<=a) return fmtShort(a);if(ym(a)===ym(b)) return Number(a.slice(8))+'–'+Number(b.slice(8))+' '+MG[Number(a.slice(5,7))-1];return fmtShort(a)+' – '+fmtShort(b)};
const nf0=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0});
const nf2=new Intl.NumberFormat('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
const cur=()=>state.settings.currency||'₽';
const r2=v=>Math.round((Number(v)||0)*100)/100;
function nfm(v){v=Math.abs(r2(v));return (Number.isInteger(v)?nf0:nf2).format(v)}
function money(v,sign){v=r2(v);return (v<0?'−':(sign&&v>0?'+':''))+nfm(v)+' '+cur()}
const rangeTxt=(lo,hi)=>nfm(lo)+'–'+nfm(hi)+' '+cur();
const parseAmount=s=>{const n=Number(String(s).replace(/[\s ]/g,'').replace(',','.'));return isFinite(n)&&String(s).trim()!==''?n:NaN};
function parseRange(s){
  s=String(s==null?'':s).trim(); if(!s) return null;
  const m=s.match(/^(.+?)\s*(?:[-–—−]|\.\.\.?|…|до)\s*(.+)$/i);
  if(m){let a=parseAmount(m[1]),b=parseAmount(m[2]);if(isFinite(a)&&isFinite(b)){if(a>b){const t=a;a=b;b=t}return {lo:a,hi:b}}return null}
  const a=parseAmount(s);return isFinite(a)?{lo:a,hi:a}:null;
}
const rangeInput=(lo,hi)=>{lo=Number(lo)||0;hi=Number(hi);return lo?(hi>lo?lo+'–'+hi:String(lo)):''};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const clone=o=>JSON.parse(JSON.stringify(o));
const ICONS={left:'<path d="M15 18l-6-6 6-6"/>',right:'<path d="M9 18l6-6-6-6"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>'};
const ic=n=>'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+ICONS[n]+'</svg>';
async function pool(items,fn,n){const q=items.slice();const w=Array.from({length:Math.min(n||6,q.length)},async()=>{while(q.length){await fn(q.shift())}});await Promise.all(w)}

/* ---------- prefs (per device) ---------- */
const PK='moya-kassa-ui';
const prefs={hide:false,keys:{},active:'',open:{},tab:'',scr:{}};
function loadPrefs(){try{const j=JSON.parse(localStorage.getItem(PK)||'{}');prefs.hide=!!j.hide;prefs.keys=j.keys&&typeof j.keys==='object'?j.keys:{};prefs.active=j.active||'';prefs.open=j.open&&typeof j.open==='object'?j.open:{};prefs.tab=j.tab||'';prefs.scr=j.scr&&typeof j.scr==='object'?j.scr:{}}catch(e){}}
function savePrefs(){try{localStorage.setItem(PK,JSON.stringify(prefs))}catch(e){}}

/* ---------- state ---------- */
const KINDS=['ops','recs','debts'];
const PCOL=6;
const DEF_INC=['Зарплата','Аванс','Стипендия','Подработка','Подарки','Возврат долга','Прочие доходы'];
const DEF_EXP=['Жильё','Коммунальные услуги','Связь и интернет','Продукты','Транспорт','Кафе и рестораны','Здоровье','Одежда','Развлечения','Подписки','Кредиты и долги','Накопления','Прочие расходы'];
const defSettings=()=>({ready:false,demo:false,startDate:todayISO(),currency:'₽',cats:{income:DEF_INC.slice(),expense:DEF_EXP.slice()},people:[{id:'p1',name:'Я',ci:0,start:0}],adj:[]});
function normSettings(d){
  const b=defSettings(); if(!d) return b;
  const c=d.cats||{};
  let people=Array.isArray(d.people)&&d.people.length?d.people.map((p,i)=>({id:String(p.id||('p'+(i+1))),name:String(p.name||('Участник '+(i+1))),ci:Number.isInteger(p.ci)?((p.ci%PCOL)+PCOL)%PCOL:i%PCOL,start:Number(p.start)||0}))
    :[{id:'p1',name:'Я',ci:0,start:Number(d.startBalance)||0}];
  return {ready:!!d.ready,demo:!!d.demo,
    startDate:/^\d{4}-\d{2}-\d{2}$/.test(d.startDate||'')?d.startDate:b.startDate,
    currency:d.currency||'₽',
    cats:{income:Array.isArray(c.income)?c.income:b.cats.income,expense:Array.isArray(c.expense)?c.expense:b.cats.expense},people,eHide:!!d.eHide,eRare:!!d.eRare,eOff:d.eOff!==undefined?!!d.eOff:d.shopOn===false,shopWish:d.shopWish!==false,eMan:Math.max(0,Number(d.eMan)||0),eManFirst:!!d.eManFirst,
    adj:Array.isArray(d.adj)?d.adj.filter(a=>a&&a.id&&/^\d{4}-\d{2}-\d{2}$/.test(a.date||'')&&isFinite(Number(a.delta))).map(a=>({id:String(a.id),who:String(a.who||''),date:a.date,delta:Number(a.delta),was:Number(a.was)||0,to:Number(a.to)||0,note:String(a.note||'')})):[]};
}
const state={loaded:false,dataReady:false,profiles:new Map(),active:'',settings:defSettings(),ops:new Map(),recs:new Map(),debts:new Map()};
const ui={tab:'home',month:ym(todayISO()),filter:'all',scope:'all',lastWho:undefined,capturing:null,showClosed:false};
let lastModel=null,hlT=0;
const people=()=>state.settings.people;
const multi=()=>people().length>1;
const sortedProfiles=()=>[...state.profiles.values()].sort((a,b)=>(a.created-b.created)||(a.id<b.id?-1:1));
function curScope(){return (!multi()||prefs.hide||!people().some(p=>p.id===ui.scope))?'all':ui.scope}

/* ---------- storage ---------- */
const Store={mode:'',db:null,pcol:null,uid:'',unsubs:[],tok:0,local:null,dl:null,t:0,failAt:0,boot:false};
const chains=new Map();
function enqueue(path,fn){const prev=chains.get(path)||Promise.resolve();const next=prev.catch(()=>{}).then(fn);chains.set(path,next.catch(()=>{}));return next}
function failed(){const n=Date.now();if(n-Store.failAt>4000){Store.failAt=n;toast('Не удалось сохранить. Проверьте соединение и повторите.')}}
function flushLocal(){
  clearTimeout(Store.t);Store.t=0;
  if(!Store.local) return;
  try{
    const out=[];
    Store.local.profiles.forEach(p=>{const d=Store.local.data[p.id];out.push({id:p.id,name:p.name,created:p.created,settings:p.settings,ops:[...d.ops.values()],recs:[...d.recs.values()],debts:[...d.debts.values()]})});
    localStorage.setItem('moya-kassa-v2',JSON.stringify({v:2,profiles:out}));
  }catch(e){}
  if(window.Sync&&Sync.cfg) syncScan();
}
function persistLocal(){clearTimeout(Store.t);Store.t=setTimeout(flushLocal,120)}
window.addEventListener('pagehide',()=>{if(Store.t) flushLocal()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&Store.t) flushLocal()});
function addLocalProfile(p){
  const id=p.id||uid();
  const pr={id,name:p.name||'Профиль',created:p.created||Date.now(),settings:normSettings(p.settings)};
  Store.local.profiles.set(id,pr);
  Store.local.data[id]={ops:new Map((p.ops||[]).map(o=>[o.id,o])),recs:new Map((p.recs||[]).map(o=>[o.id,o])),debts:new Map((p.debts||[]).map(o=>[o.id,o]))};
  return id;
}
function loadLocal(){
  const L={profiles:new Map(),data:{}};Store.local=L;state.profiles=L.profiles;
  try{
    const raw=localStorage.getItem('moya-kassa-v2');
    if(raw){const j=JSON.parse(raw);(j.profiles||[]).forEach(p=>addLocalProfile(p))}
    else{const r1=localStorage.getItem('moya-kassa-v1');if(r1){const j=JSON.parse(r1);addLocalProfile({name:'Основной',settings:j.settings,ops:j.ops,recs:j.recs})}}
  }catch(e){}
  if(!L.profiles.size) addLocalProfile({name:'Основной'});
  const pick=prefs.active&&L.profiles.has(prefs.active)?prefs.active:sortedProfiles()[0].id;
  activate(pick);
}
function rawPut(kind,obj){
  state[kind].set(obj.id,obj);
  if(Store.mode==='db'){const pid=state.active;return enqueue(pid+'/'+kind+'/'+obj.id,()=>Store.pcol.doc(pid).collection(kind).doc(obj.id).set(clone(obj))).catch(failed)}
  persistLocal();
}
function rawDel(kind,id){
  state[kind].delete(id);
  if(Store.mode==='db'){const pid=state.active;return enqueue(pid+'/'+kind+'/'+id,()=>Store.pcol.doc(pid).collection(kind).doc(id).delete()).catch(failed)}
  persistLocal();
}
function writeProfile(pid){
  const p=state.profiles.get(pid);if(!p) return;
  if(Store.mode==='db') return enqueue('p/'+pid,()=>Store.pcol.doc(pid).set({name:p.name,created:p.created,settings:clone(p.settings)})).catch(failed);
  persistLocal();
}
function attachDb(pid){
  Store.unsubs.forEach(u=>{try{u()}catch(e){}});Store.unsubs=[];
  state.ops=new Map();state.recs=new Map();state.debts=new Map();state.dataReady=false;
  const flags={ops:false,recs:false,debts:false},token=++Store.tok;
  const chk=()=>{if(token!==Store.tok) return;if(flags.ops&&flags.recs&&flags.debts) state.dataReady=true;schedule()};
  KINDS.forEach(k=>{
    Store.unsubs.push(Store.pcol.doc(pid).collection(k).onSnapshot(snap=>{
      if(token!==Store.tok) return;
      state[k]=new Map(snap.docs.map(d=>[d.id,Object.assign({},d.data(),{id:d.id})]));
      if(!snap.metadata.fromCache) flags[k]=true;chk();
    },()=>{if(token===Store.tok){state.dataReady=true;toast('Нет доступа к хранилищу. Данные могут не сохраниться.');schedule()}}));
  });
  setTimeout(()=>{if(token===Store.tok&&!state.dataReady){state.dataReady=true;schedule()}},4000);
}
function activate(pid){
  state.active=pid;prefs.active=pid;savePrefs();
  const p=state.profiles.get(pid);state.settings=p.settings;
  hist.undo=[];hist.redo=[];
  if(Store.mode==='db') attachDb(pid);
  else{const d=Store.local.data[pid];state.ops=d.ops;state.recs=d.recs;state.debts=d.debts;state.dataReady=true}
}
async function bootstrapDb(){
  let done=false;
  try{
    const old=Store.db.doc('data/users/'+Store.uid+'/app');
    const s=await old.get();
    if(s.exists&&s.data()&&s.data().ready){
      const pid=uid();
      await Store.pcol.doc(pid).set({name:'Основной',created:Date.now(),settings:clone(normSettings(s.data()))});
      const o=await old.collection('ops').get(),r=await old.collection('recs').get();
      await pool(o.docs,d=>Store.pcol.doc(pid).collection('ops').doc(d.id).set(Object.assign({},d.data())),6);
      await pool(r.docs,d=>Store.pcol.doc(pid).collection('recs').doc(d.id).set(Object.assign({},d.data())),6);
      done=true;
    }
  }catch(e){}
  if(!done){try{await Store.pcol.doc(uid()).set({name:'Основной',created:Date.now(),settings:clone(defSettings())})}catch(e){failed()}}
}
function onProfiles(snap){
  const m=new Map();
  snap.docs.forEach(d=>{const x=d.data()||{};m.set(d.id,{id:d.id,name:x.name||'Профиль',created:x.created||0,settings:normSettings(x.settings)})});
  state.profiles=m;
  if(m.size===0){
    if(!snap.metadata.fromCache&&!Store.boot){Store.boot=true;bootstrapDb()}
    schedule();return;
  }
  if(!state.active||!m.has(state.active)){
    activate(prefs.active&&m.has(prefs.active)?prefs.active:sortedProfiles()[0].id);
  }else state.settings=m.get(state.active).settings;
  schedule();
}
async function initDb(token){
  const cl=window.claude;if(!cl||!cl.use) return false;
  let db=null,user=null;
  try{db=await cl.use('db')}catch(e){}
  try{user=await cl.use('user')}catch(e){}
  try{Store.dl=await cl.use('downloads')}catch(e){}
  if(token.cancelled||!db||!user) return false;
  let id=null;try{id=await user.id()}catch(e){}
  if(token.cancelled||!id) return false;

create table if not exists public.kassa_rows(
  room text not null, coll text not null, id text not null,
  data jsonb, u bigint not null, del boolean not null default false,
  seq bigint not null,
  primary key(room,coll,id));
create sequence if not exists public.kassa_seq;
create index if not exists kassa_rows_room_seq on public.kassa_rows(room,seq);
alter table public.kassa_rows enable row level security;

create or replace function public.kassa_push(p_room text, p_rows jsonb) returns bigint
language plpgsql security definer set search_path=public as $$
declare r jsonb; mx bigint;
begin
  if length(p_room)<16 then raise exception 'ключ комнаты слишком короткий'; end if;
  for r in select * from jsonb_array_elements(p_rows) loop
    insert into kassa_rows(room,coll,id,data,u,del,seq)
    values(p_room,r->>'c',r->>'i',r->'d',(r->>'u')::bigint,coalesce((r->>'x')::boolean,false),nextval('kassa_seq'))
    on conflict(room,coll,id) do update
      set data=excluded.data,u=excluded.u,del=excluded.del,seq=excluded.seq
      where kassa_rows.u<=excluded.u;
  end loop;
  select coalesce(max(seq),0) into mx from kassa_rows where room=p_room;
  return mx;
end $$;

create or replace function public.kassa_pull(p_room text, p_since bigint) returns jsonb
language sql security definer set search_path=public as $$
  select coalesce(jsonb_agg(jsonb_build_object('c',coll,'i',id,'d',data,'u',u,'x',del,'s',seq) order by seq),'[]'::jsonb)
  from kassa_rows where room=p_room and seq>p_since and length(p_room)>=16;
$$;

grant execute on function public.kassa_push(text,jsonb) to anon, authenticated;
grant execute on function public.kassa_pull(text,bigint) to anon, authenticated;

notify pgrst, 'reload schema';

/* ---------- history (undo / redo) ---------- */
const hist={undo:[],redo:[]};
let tx=null;
function track(kind,id,prev,next){if(tx) tx.push({kind,id,prev:prev?clone(prev):null,next:next?clone(next):null})}
function commit(label,fn,o){
  const outer=tx;tx=outer||[];
  try{fn()}finally{}
  if(outer) return;
  const t=tx;tx=null;
  if(!t.length) return;
  hist.undo.push({label,t});if(hist.undo.length>80) hist.undo.shift();hist.redo=[];
  renderHeader();
}
const Persist={
  put(kind,obj){track(kind,obj.id,state[kind].get(obj.id),obj);rawPut(kind,obj)},
  del(kind,id){const prev=state[kind].get(id);if(!prev) return;track(kind,id,prev,null);rawDel(kind,id)},
  settings(mut){const prev=clone(state.settings);mut(state.settings);track('settings','s',prev,state.settings);writeProfile(state.active)}
};
function restore(kind,id,val){
  if(kind==='settings'){if(!val) return;state.settings=clone(val);const p=state.profiles.get(state.active);if(p) p.settings=state.settings;writeProfile(state.active)}
  else if(val==null) rawDel(kind,id);else rawPut(kind,clone(val));
}
function undo(){
  const e=hist.undo.pop();if(!e){toast('Нечего отменять');return}
  [...e.t].reverse().forEach(c=>restore(c.kind,c.id,c.prev));
  hist.redo.push(e);toast('Отменено: '+e.label);renderHeader();render(true);
}
function redo(){
  const e=hist.redo.pop();if(!e){toast('Нечего возвращать');return}
  e.t.forEach(c=>restore(c.kind,c.id,c.next));
  hist.undo.push(e);toast('Возвращено: '+e.label);renderHeader();render(true);
}

/* ---------- finance engine ---------- */
function amountsOf(type,lo,hi){lo=Number(lo)||0;let h=(hi===''||hi==null)?lo:Number(hi);if(!(h>lo)) h=lo;return {lo,hi:h,calc:type==='expense'?h:lo}}
const calcOf=o=>amountsOf(o.type,o.amount,o.amountMax).calc;
function weight(who,scope){
  if(scope==='all') return 1;
  const P=people();const x=who===undefined?P[0].id:who;
  const mine=P.some(p=>p.id===x)?x:'';
  if(mine===scope) return 1;
  if(mine==='') return 1/(P.length||1);
  return 0;
}
function opItem(o,scope,start,today){
  const w=weight(o.who,scope);if(!w) return null;
  const d1=o.date;if(!d1) return null;
  const d2=o.dateEnd&&o.dateEnd>d1?o.dateEnd:'';
  const eff=o.type==='income'&&d2?d2:d1;
  if(eff<start) return null;
  const a=amountsOf(o.type,o.amount,o.amountMax),fact=o.status==='fact';
  return {key:'o:'+o.id,src:'op',id:o.id,date:eff,d1,d2,type:o.type,lo:a.lo*w,hi:a.hi*w,val:a.calc*w,status:fact?'fact':'plan',cat:o.cat||'',
    name:o.desc||o.cat||(o.type==='income'?'Доход':'Расход'),party:o.party||'',who:o.who,debtId:o.debtId||'',late:!fact&&(d2||d1)<today,after:o.after||''};
}
function recOcc(r,key,start){
  if(!r.active) return null;
  const p=key.split('-').map(Number),n=dim(p[0],p[1]);
  const day=Math.min(Number(r.day)||1,n);
  const d1=iso(p[0],p[1],day);
  const de=Number(r.dayEnd)>Number(r.day)?Math.min(Number(r.dayEnd),n):0;
  const d2=de>day?iso(p[0],p[1],de):'';
  const eff=r.type==='income'&&d2?d2:d1;
  if(eff<start) return null;
  if(r.start&&d1<r.start) return null;
  if(r.end&&d1>r.end) return null;
  return {d1,d2,eff};
}
function recItem(r,key,scope,start,today){
  const w=weight(r.who,scope);if(!w) return null;
  const oc=recOcc(r,key,start);if(!oc) return null;
  const ov=(r.ov&&r.ov[key])||{};
  if(ov.skip) return null;

function applyLinks(months){
  const all=new Map();months.forEach(m=>m.items.forEach(it=>all.set(it.key,it)));
  const find=it=>{const a=it.after;if(!a) return null;
    if(a.charAt(0)==='o') return all.get('o:'+a.slice(2))||null;
    const id=a.slice(2),k0=ym(it.d1||it.date);
    return all.get('r:'+id+':'+k0)||all.get('r:'+id+':'+addM(k0,1))||all.get('r:'+id+':'+addM(k0,-1))||null};
  const cmp=(a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.type===b.type?0:a.type==='income'?-1:1);
  let any=false;
  months.forEach(m=>m.items.forEach(it=>{
    if(!it.after) return;const t=find(it);if(!t||t===it) return;
    it.afterName=t.name;any=true;
    if(t.date>it.date){const mk=ym(it.date),y=+mk.slice(0,4),mo=+mk.slice(5,7),nd=ym(t.date)===mk?t.date:iso(y,mo,dim(y,mo));if(nd>it.date) it.date=nd}
    if(it.date===t.date&&t.type==='expense'&&it.type==='income') t.pd=addD(t.date,-1);
  }));
  if(!any) return;
  months.forEach(m=>{
    m.items.sort(cmp);
    for(const it of m.items.slice()){
      if(!it.afterName) continue;const t=find(it);if(!t) continue;
      const ti=m.items.indexOf(t),ii=m.items.indexOf(it);
      if(ti>=0&&it.date===t.date&&ii<ti){m.items.splice(ii,1);m.items.splice(m.items.indexOf(t)+1,0,it)}
    }
  });
}
function linkOpts(kind,selfId,cur,q){

function buildModel(scope){
  const st=state.settings,today=todayISO(),start=st.startDate,P=st.people;
  const startTotal=scope==='all'?P.reduce((a,p)=>a+(Number(p.start)||0),0):(Number((P.find(p=>p.id===scope)||{}).start)||0);
  const ed=everyday(scope),tk=ym(today);
  const first=ym(start);let last=addM(first,23);
  const adjL=(st.adj||[]).filter(a=>scope==='all'||a.who===scope),adjBy=new Map();
  for(const a of adjL){let k=ym(a.date);if(k<first) k=first;adjBy.set(k,(adjBy.get(k)||0)+a.delta)}
  const byM=new Map();
  for(const o of state.ops.values()){
    const it=opItem(o,scope,start,today);if(!it) continue;
    const k=ym(it.date);if(!byM.has(k)) byM.set(k,[]);byM.get(k).push(it);
    if(k>last) last=k;
  }
  const cap=addM(first,120);if(last>cap) last=cap;
  const months=[];let open=startTotal,key=first;
  while(key<=last){
    const items=(byM.get(key)||[]).slice();
    for(const r of state.recs.values()){const it=recItem(r,key,scope,start,today);if(it) items.push(it)}
    items.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.type===b.type?0:a.type==='income'?-1:1));
    const t={ifact:0,iplan:0,efact:0,eplan:0};let rng=false;
    for(const it of items){t[(it.type==='income'?'i':'e')+it.status]+=it.val;if(it.status==='plan'&&(it.lo!==it.hi||it.d2)) rng=true}
    let syn=0;
    if(ed&&key>=tk){const yy=+key.slice(0,4),mm=+key.slice(5,7);syn=r2(ed.perDay*(key===tk?dim(yy,mm)-Number(today.slice(8))+1:dim(yy,mm)))}
    t.eplan+=syn;
    const income=t.ifact+t.iplan,expense=t.efact+t.eplan,adj=adjBy.get(key)||0,close=open+income-expense+adj;
    months.push(Object.assign({key,items,income,expense,open,close,rng,syn,adj},t));
    open=close;key=addM(key,1);
  }
  applyLinks(months);
  const balanceNow=startTotal+months.reduce((a,m)=>a+m.ifact-m.efact,0)+adjL.reduce((a,x)=>a+x.delta,0);
  return {months,byKey:new Map(months.map(m=>[m.key,m])),balanceNow,today,first,last,scope,ed};
}
function findItem(k){if(!lastModel) return null;for(const m of lastModel.months) for(const it of m.items) if(it.key===k) return it;return null}
function nextDate(r,today){

  }

}

function debtStats(d,ops,today){
  let paid=0,planned=0,next=null,late=false;
  for(const o of ops){

/* ---------- views ---------- */
function periodModel(M){
  const today=M.today,ty=+today.slice(0,4),tm=+today.slice(5,7);
  const eom=iso(ty,tm,dim(ty,tm)),horizon=addD(today,60);
  const plan=[];M.months.forEach(m=>m.items.forEach(it=>{if(it.status==='plan') plan.push(it)}));
  const incs=plan.filter(it=>it.type==='income'&&!it.late&&it.date>=today);
  const bounds=[...new Set(incs.map(it=>it.date))].sort();
  const exps=plan.filter(it=>it.type==='expense');
  const cuts=[null].concat(bounds),out=[];let bal=M.balanceNow;
  for(let i=0;i<cuts.length;i++){
    const from=cuts[i],to=cuts[i+1]||null;
    if(from&&from>horizon) break;
    const cap=to||(i===0?addD(eom,1):addD(horizon,1));
    const ex=exps.filter(it=>{const d=it.pd||it.date;return (from===null||d>=from)&&d<cap});
    const inc=from?incs.filter(it=>it.date===from):[];
    const incSum=inc.reduce((a,it)=>a+it.val,0),exOps=ex.reduce((a,it)=>a+it.val,0);
    const a0=(from&&from>today)?from:today,days=Math.max(0,ddays(a0,cap)),eday=M.ed?r2(M.ed.perDay*days):0,expSum=exOps+eday;
    const end=bal+incSum-expSum;bal=end;
    out.push({from,to,ex,inc,incSum,expSum,expOps:exOps,eday,days,end});
  }
  return out;
}

function startOf(scope){const P=state.settings.people;return scope==='all'?P.reduce((a,p)=>a+(Number(p.start)||0),0):(Number((P.find(p=>p.id===scope)||{}).start)||0)}
function ledgerRows(scope){
  const M=buildModel(scope),rows=[];let inc=0,exp=0,adjS=0;
  for(const m of M.months) for(const it of m.items){
    if(it.status!=='fact') continue;
    const d=it.type==='income'?it.val:-it.val;if(d>0) inc+=d;else exp-=d;
    rows.push({date:it.date,name:it.name,who:it.who,d,kind:'op'});

    if(scope!=='all'&&a.who!==scope) continue;

  return {rows,inc,exp,adjS,start:startOf(scope),total:run,model:M};
}

function debtSummary(){
  const dops=debtOps(),today=todayISO(),sc=curScope();let owe=0,lent=0,count=0;
  for(const d of state.debts.values()){
    const w=weight(d.who,sc);if(!w) continue;
    const st=debtStats(d,dops.get(d.id)||[],today);if(st.closed) continue;
    count++;if(d.dir==='owe') owe+=st.remaining*w;else lent+=st.remaining*w;
  }
  return {owe,lent,count};
}

function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1)));for(const k of [1,2,2.5,5,10]) if(k*p>=x) return k*p;return 10*p}
function short(v){const a=Math.abs(v);if(a>=1e6) return (v/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,'').replace('.',',')+' млн';if(a>=1e3) return (v/1e3).toFixed(1).replace(/\.0$/,'').replace('.',',')+' тыс';return String(Math.round(v))}
function chartSVG(ms,todayKey){
  const W=640,H=240,Lm=48,Rm=10,Tm=12,Bm=26,iw=W-Lm-Rm,ih=H-Tm-Bm;
  const maxV=Math.max(1,...ms.map(m=>Math.max(m.income,m.expense)));
  const step=niceStep(maxV/4),top=step*Math.ceil(maxV/step),y=v=>Tm+ih-(v/top)*ih;
  let g='<defs><pattern id="hi" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--surface)"/><line x1="0" y1="0" x2="0" y2="5" style="stroke:var(--income)" stroke-width="2.2"/></pattern>'
    +'<pattern id="he" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--surface)"/><line x1="0" y1="0" x2="0" y2="5" style="stroke:var(--expense)" stroke-width="2.2"/></pattern></defs>';
  for(let v=0;v<=top+1e-9;v+=step) g+='<line x1="'+Lm+'" x2="'+(W-Rm)+'" y1="'+y(v)+'" y2="'+y(v)+'" class="gl"/><text x="'+(Lm-6)+'" y="'+(y(v)+4)+'" text-anchor="end" class="tx">'+short(v)+'</text>';
  const gw=iw/ms.length,bw=Math.min(20,gw*0.34);
  const bar=(x,f,p,c)=>{let s='';const yf=y(f),yp=y(f+p);
    if(f>0) s+='<rect x="'+x+'" y="'+yf+'" width="'+bw+'" height="'+(y(0)-yf)+'" class="b '+c+'"/>';
    if(p>0) s+='<rect x="'+x+'" y="'+yp+'" width="'+bw+'" height="'+(yf-yp)+'" class="b p '+c+'"/>';return s};
  ms.forEach((m,i)=>{
    const cx=Lm+gw*i+gw/2,mo=Number(m.key.slice(5)),yr=m.key.slice(2,4);
    if(m.key===todayKey) g+='<rect x="'+(Lm+gw*i+2)+'" y="'+Tm+'" width="'+(gw-4)+'" height="'+ih+'" class="now"/>';
    g+=bar(cx-bw-1,m.ifact,m.iplan,'in')+bar(cx+1,m.efact,m.eplan,'ex');
    g+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" class="tx">'+MN[mo-1].slice(0,3)+((mo===1||i===0)?' '+yr:'')+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Доходы и расходы по месяцам">'+g+'</svg>';
}

function comboFromEvent(e){
  if(/^(Control|Shift|Alt|Meta)(Left|Right)$/.test(e.code)||!e.code) return '';
  const code=e.code==='NumpadEnter'?'Enter':e.code;
  return ((e.ctrlKey||e.metaKey)?'Ctrl+':'')+(e.altKey?'Alt+':'')+(e.shiftKey?'Shift+':'')+code;
}
function comboLabel(c){
  return c.split('+').map(p=>{
    if(/^Key[A-Z]$/.test(p)) return p.slice(3);
    if(/^Digit\d$/.test(p)) return p.slice(5);
    const m={ArrowLeft:'←',ArrowRight:'→',ArrowUp:'↑',ArrowDown:'↓',Slash:'/',Space:'Пробел',Escape:'Esc',Comma:',',Period:'.',BracketLeft:'[',BracketRight:']'};
    return m[p]||p;
  }).join(' + ');
}

/* системная кнопка «назад» закрывает окно: на время открытого окна в истории лежит одна служебная запись */
function reconcileHist(){
  if(histBusy) return;
  const open=!$('#modal').hidden;
  if(open&&histDepth===0){try{history.pushState({sheet:1},'');histDepth=1}catch(e){}}
  else if(!open&&histDepth===1){histBusy=true;clearTimeout(histT);histT=setTimeout(()=>{histBusy=false;histDepth=0},800);try{history.back()}catch(e){histBusy=false;histDepth=0}}
}
/* перетаскивание за ручку «⠿»: контейнер [data-drag], элементы [data-dv], обработчик DRAGH[имя](контейнер,откуда,куда) */
const DRAGH={};let dragSuppress=0;
DRAGH.fcat=(box,from,to)=>{const t=box.dataset.t;commit('Порядок категорий',()=>Persist.settings(s=>{const a=s.cats[t].slice(),i=a.indexOf(from),j=a.indexOf(to);if(i<0||j<0) return;a.splice(i,1);a.splice(j,0,from);s.cats[t]=a}),{quiet:true});render(true)};
document.addEventListener('click',e=>{if(dragSuppress){e.stopPropagation();e.preventDefault()}},true);
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest&&e.target.closest('.grip');if(!g) return;
  const box=g.closest('[data-drag]'),el=g.closest('[data-dv]');if(!box||!el||!DRAGH[box.dataset.drag]) return;
  e.preventDefault();
  const r0=el.getBoundingClientRect(),x0=e.clientX,y0=e.clientY,items=[...box.querySelectorAll('[data-dv]')];
  let target=null,moved=false,raf=0,py=y0;
  try{g.setPointerCapture(e.pointerId)}catch(_){}
  el.classList.add('dragging');
  const hit=(x,y)=>{el.style.visibility='hidden';const t=document.elementFromPoint(x,y);el.style.visibility='';const c=t&&t.closest?t.closest('[data-dv]'):null;return c&&c!==el&&box.contains(c)?c:null};
  const scroll=()=>{if(!el.classList.contains('dragging')) return;if(py<70) window.scrollBy(0,-14);else if(py>innerHeight-70) window.scrollBy(0,14);raf=requestAnimationFrame(scroll)};
  raf=requestAnimationFrame(scroll);
  const mv=ev=>{
    const dx=ev.clientX-x0,dy=ev.clientY-y0;py=ev.clientY;
    if(Math.abs(dx)+Math.abs(dy)>4) moved=true;
    el.style.transform='translate('+dx+'px,'+dy+'px)';
    const t=hit(ev.clientX,ev.clientY);
    if(t!==target){if(target) target.classList.remove('dropto');target=t;if(target) target.classList.add('dropto')}
  };
  const up=()=>{
    cancelAnimationFrame(raf);g.removeEventListener('pointermove',mv);g.removeEventListener('pointerup',up);g.removeEventListener('pointercancel',up);
    el.classList.remove('dragging');el.style.transform='';items.forEach(i=>i.classList.remove('dropto'));
    if(moved){dragSuppress=1;setTimeout(()=>{dragSuppress=0},350)}
    if(moved&&target) DRAGH[box.dataset.drag](box,el.dataset.dv,target.dataset.dv);
  };
  g.addEventListener('pointermove',mv);g.addEventListener('pointerup',up);g.addEventListener('pointercancel',up);
});

function rawCalcOf(it){
  if(it.src==='op'){const o=state.ops.get(it.id);return o?calcOf(o):it.val}
  const r=state.recs.get(it.id);if(!r) return it.val;
  const ov=(r.ov&&r.ov[it.mkey])||{};
  return ov.amount!=null?Number(ov.amount):amountsOf(r.type,r.amount,r.amountMax).calc;
}

function saveOcc(){
  const r=state.recs.get(fs.id);if(!r) return closeSheet();
  const rr=parseRange($('#f-amount').value),skip=$('#o-skip').checked,paid=$('#o-paid').checked;
  if(!skip&&(!rr||!(rr.lo>0))) return ($('#f-err').textContent='Введите сумму больше нуля.');
  const ranged=Number(r.amountMax)>Number(r.amount),base=amountsOf(r.type,r.amount,r.amountMax).calc;
  commit(skip?'Платёж пропущен':'Изменения сохранены',()=>{
    const ov=Object.assign({},r.ov||{});const o={};
    if(skip) o.skip=true;
    else{
      if(paid!==fs.auto) o.paid=paid;
      const od=((r.ov&&r.ov[fs.mkey])||{}).date;
      if(paid&&paid!==fs.auto) o.date=od||todayISO();
      const a=rr.lo;if(a!==base||(paid&&ranged)) o.amount=a;
    }
    if(Object.keys(o).length) ov[fs.mkey]=o;else delete ov[fs.mkey];
    Persist.put('recs',Object.assign({},r,{ov}));
  });
  closeSheet();schedule();
}

function doPay(it,amount,date){
  commit(it.type==='income'?'Отмечено как полученное':'Отмечено как оплаченное',()=>{
    if(it.src==='op'){
      const o=state.ops.get(it.id);if(!o) return;
      const n=Object.assign({},o,{status:'fact',dateEnd:''});
      n.prev={date:o.date,dateEnd:o.dateEnd||'',amount:o.amount,amountMax:o.amountMax||''};
      if(amount!=null){n.amount=amount;n.amountMax=''}
      n.date=date||(o.date>todayISO()?todayISO():o.date);
      Persist.put('ops',n);
    }else{
      const r=state.recs.get(it.id);if(!r) return;
      const ov=Object.assign({},r.ov||{});ov[it.mkey]=Object.assign({},ov[it.mkey]||{},{paid:true,date:date||todayISO()});
      if(amount!=null) ov[it.mkey].amount=amount;
      Persist.put('recs',Object.assign({},r,{ov}));
    }
  });
  schedule();
}

function readSched(total,dir,party,account,who){
  const mode=fs.sched,ops=[];
  const type=dir==='owe'?'expense':'income';
  const base=(date,amount,dateEnd)=>({id:uid(),date,dateEnd:dateEnd||'',type,cat:'Долги',desc:(dir==='owe'?'Возврат долга: ':'Возврат долга от ')+(party||'без имени'),amount,amountMax:'',status:'plan',party,account,who,debtId:fs.id||'',dk:'r'});
  if(mode==='once'){
    const due=$('#d-due').value,de=$('#d-dueend').value;
    if(!due) return {err:'Укажите, до какой даты вернуть.'};
    if(de&&de<=due) return {err:'Конец диапазона должен быть позже начала.'};
    ops.push(base(due,total,de));
  }else if(mode==='parts'){
    const per=parseAmount($('#d-per').value),first=$('#d-first').value;
    if(!(per>0)) return {err:'Укажите сумму ежемесячного платежа.'};
    if(!first) return {err:'Укажите дату первого платежа.'};
    const n=Math.ceil(total/per-1e-9);if(n>120) return {err:'Слишком много платежей: увеличьте сумму платежа.'};
    const p=first.split('-').map(Number),day=p[2];
    for(let i=0;i<n;i++){
      const k=addM(p[0]+'-'+pad(p[1]),i).split('-').map(Number);
      const amt=i===n-1?r2(total-per*(n-1)):per;
      ops.push(base(iso(k[0],k[1],Math.min(day,dim(k[0],k[1]))),amt));
    }
  }
  return {ops};
}
function saveDebt(){
  const err=m=>{$('#f-err').textContent=m};
  const party=$('#d-party').value.trim(),total=parseAmount($('#d-total').value),date=$('#d-date').value,account=$('#d-acc').value.trim(),note=$('#d-note').value.trim();
  if(!party) return err('Укажите, с кем долг.');
  if(!(total>0)) return err('Введите сумму долга больше нуля.');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return err('Укажите дату.');
  const who=readWho(fs.who);ui.lastWho=who;
  if(fs.id){
    const d=state.debts.get(fs.id);if(!d) return closeSheet();
    commit('Долг сохранён',()=>{
      Persist.put('debts',Object.assign({},d,{party,total,date,account,note,who}));
      for(const o of state.ops.values()) if(o.debtId===d.id) Persist.put('ops',Object.assign({},o,{party,account,who}));
    });
    closeSheet();schedule();return;
  }
  const id=uid();fs.id=id;
  const sc=readSched(total,fs.dir,party,account,who);if(sc.err) return err(sc.err);
  const type=fs.dir==='owe'?'income':'expense';
  commit('Долг добавлен',()=>{
    Persist.put('debts',{id,dir:fs.dir,party,total,date,who,account,note,created:Date.now()});
    if($('#d-princ').checked) Persist.put('ops',{id:uid(),date,dateEnd:'',type,cat:'Долги',desc:(fs.dir==='owe'?'Взял в долг: ':'Дал в долг: ')+party,amount:total,amountMax:'',status:date<=todayISO()?'fact':'plan',party,account,who,debtId:id,dk:'p'});
    sc.ops.forEach(o=>{o.debtId=id;Persist.put('ops',o)});
  });
  closeSheet();schedule();
}

function saveDebtPay(){
  const d=state.debts.get(fs.id);if(!d) return closeSheet();
  const r=parseRange($('#f-amount').value),date=$('#f-date').value;
  if(!r||!(r.lo>0)) return ($('#f-err').textContent='Введите сумму больше нуля.');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return ($('#f-err').textContent='Укажите дату.');
  const amount=r.lo,owe=d.dir==='owe';
  commit(owe?'Платёж по долгу внесён':'Возврат долга отмечен',()=>{
    Persist.put('ops',{id:uid(),date,dateEnd:'',type:owe?'expense':'income',cat:'Долги',desc:(owe?'Возврат долга: ':'Возврат долга от ')+d.party,amount,amountMax:'',status:'fact',party:d.party,account:d.account||'',who:d.who,debtId:d.id,dk:'r'});
    let rest=amount;
    const plan=[...state.ops.values()].filter(o=>o.debtId===d.id&&o.dk==='r'&&o.status==='plan').sort((a,b)=>a.date<b.date?-1:1);
    for(const o of plan){
      if(rest<=0.004) break;
      const a=calcOf(o);
      if(rest>=a-0.004){Persist.del('ops',o.id);rest-=a}
      else{Persist.put('ops',Object.assign({},o,{amount:r2(a-rest),amountMax:''}));rest=0}
    }
  });
  closeSheet();schedule();
}

async function createProfile(name,settings,data){
  const id=uid(),p={id,name,created:Date.now(),settings:normSettings(settings)};
  if(Store.mode==='db'){
    state.profiles.set(id,p);
    await Store.pcol.doc(id).set({name:p.name,created:p.created,settings:clone(p.settings)});
    if(data) for(const k of KINDS) await pool(data[k]||[],o=>Store.pcol.doc(id).collection(k).doc(o.id).set(clone(o)),6);
  }else{addLocalProfile(Object.assign({id},{name,created:p.created,settings:p.settings},data||{}));persistLocal()}
  return id;
}
function switchTo(id){
  if(!state.profiles.has(id)) return;
  activate(id);ui.month=ym(todayISO());ui.scope='all';ui.tab='home';closeSheet();render();window.scrollTo(0,0);
}
async function deleteProfile(id){
  if(state.profiles.size<2) return;
  const rest=sortedProfiles().filter(p=>p.id!==id);
  if(Store.mode==='db'){
    for(const k of KINDS){const s=await Store.pcol.doc(id).collection(k).get();await pool(s.docs,d=>Store.pcol.doc(id).collection(k).doc(d.id).delete(),6)}
    state.profiles.delete(id);
    if(state.active===id) activate(rest[0].id);
    await Store.pcol.doc(id).delete();
  }else{Store.local.profiles.delete(id);delete Store.local.data[id];if(state.active===id) activate(rest[0].id);persistLocal()}
  render();
}
async function wipeAll(onlyDemo){
  for(const k of KINDS){const arr=[...state[k].values()].filter(o=>!onlyDemo||o.demo);for(const o of arr) await rawDel(k,o.id)}
}

/* ---------- export / import ---------- */
async function profileData(pid){
  if(pid===state.active) return {ops:[...state.ops.values()],recs:[...state.recs.values()],debts:[...state.debts.values()]};
  if(Store.mode==='db'){const out={};for(const k of KINDS){const s=await Store.pcol.doc(pid).collection(k).get();out[k]=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}))}return out}
  const d=Store.local.data[pid];return {ops:[...d.ops.values()],recs:[...d.recs.values()],debts:[...d.debts.values()]};
}
async function doExport(all){
  toast('Готовлю файл…');
  const ids=all?sortedProfiles().map(p=>p.id):[state.active],profs=[];
  for(const id of ids){const p=state.profiles.get(id),d=await profileData(id);profs.push({name:p.name,settings:p.settings,ops:d.ops,recs:d.recs,debts:d.debts})}
  const text=JSON.stringify({app:'moya-kassa',v:2,exportedAt:new Date().toISOString(),profiles:profs},null,1);
  const nm=(all?'moya-kassa-vse-profili':'moya-kassa-'+(state.profiles.get(state.active).name.replace(/[^\wа-яё-]+/gi,'-')||'profil'))+'-'+todayISO()+'.json';
  if(Store.dl){
    try{await Store.dl.save({filename:nm,data:text});toast('Файл сохранён');return}
    catch(e){if(e&&e.code==='declined') return}
  }
  try{
    const u=URL.createObjectURL(new Blob([text],{type:'application/json'}));
    const a=document.createElement('a');a.href=u;a.download=nm;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),3000);toast('Файл скачан');return;
  }catch(e){}
  copyText(text,'Не удалось скачать файл. Данные скопированы в буфер обмена, вставьте их в текстовый файл .json.');
}
function readFileText(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result));r.onerror=()=>rej(r.error);r.readAsText(f)})}
async function handleFile(f){
  if(!f) return;
  let j;
  try{j=JSON.parse(await readFileText(f))}catch(e){return toast('Файл не читается: это не JSON')}
  let profs=null;
  if(j&&j.app==='moya-kassa'&&Array.isArray(j.profiles)) profs=j.profiles;
  else if(j&&j.v===1&&Array.isArray(j.ops)&&Array.isArray(j.recs)) profs=[{name:'Импорт',settings:j.settings,ops:j.ops,recs:j.recs,debts:[]}];
  if(!profs||!profs.length) return toast('Это не похоже на файл «Финансов»');
  profs=profs.map((p,i)=>({name:String(p.name||('Импорт '+(i+1))),settings:p.settings,ops:(p.ops||[]).filter(o=>o&&o.id),recs:(p.recs||[]).filter(o=>o&&o.id),debts:(p.debts||[]).filter(o=>o&&o.id)}));
  fs={kind:'import',profs};
  openSheet('Импорт из файла','<div class="form"><p class="s">Файл: '+esc(f.name)+'. Каждый профиль добавится как новый, текущие данные не изменятся.</p>'
    +profs.map(p=>'<div class="card"><b>'+esc(p.name)+'</b><br><span class="s">операций '+p.ops.length+' · повторяющихся '+p.recs.length+' · долгов '+p.debts.length+'</span></div>').join('')+'</div>',
    '<div class="actions"><span class="grow"></span><button class="btn" type="button" data-act="close">Отмена</button><button class="btn primary" type="button" data-act="do-import" data-primary="1">Импортировать</button></div>');
}
async function doImport(){
  const profs=fs.profs;closeSheet();toast('Импортирую…');
  let first=null;
  for(const p of profs){
    let nm=p.name;const names=new Set([...state.profiles.values()].map(x=>x.name));
    if(names.has(nm)) nm+=' (импорт)';
    const s=normSettings(p.settings);if(!p.settings) s.ready=false;
    const id=await createProfile(nm,s,{ops:p.ops,recs:p.recs,debts:p.debts});if(!first) first=id;
  }
  if(first) switchTo(first);
  toast('Импорт завершён');
}

};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled) return;
  const f=act[el.dataset.act];if(f) f(el,e);
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(fs&&(id==='f-amount'||id==='f-date'||id==='f-dend')) updHint();
  if(id==='f-after-q'&&fs){const sel=$('#f-after');if(sel){const cur=sel.value;sel.innerHTML=linkSelectHTML(fs.lk,fs.ls,cur,e.target.value);sel.value=cur}}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='imp-file'){const f=el.files&&el.files[0];el.value='';handleFile(f);return}
  if((el.id==='f-date'||el.id==='f-dend')&&fs&&fs.kind==='op'&&!fs.touched&&el.value){
    const today=todayISO(),d=$('#f-date').value,de=$('#f-dend').value;
    fs.status=((de&&de>d?de:d)<=today)?'fact':'plan';
    const seg=$('#f-status');if(seg) seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===fs.status));
  }
  if(el.id==='f-repeat'&&fs){fs.repeat=el.checked;$('#f-repeat-box').hidden=!el.checked;$('#f-status-box').hidden=el.checked}
  if(el.id==='o-cur'){$('#o-cur-i').textContent=el.value}
  if(el.dataset&&el.dataset.pname){const p=state.profiles.get(state.active);const v=el.value.trim();if(p&&v&&v!==p.name){p.name=v;writeProfile(state.active);renderHeader()}}
  if(el.dataset&&el.dataset.p){
    const id=el.dataset.p,f=el.dataset.f;
    if(f==='start'){const v=el.value.trim()===''?0:parseAmount(el.value);if(!isFinite(v)){toast('Сумма введена неверно');const p=people().find(x=>x.id===id);el.value=p?p.start:0;return}
      commit('Стартовая сумма изменена',()=>Persist.settings(s=>{const p=s.people.find(x=>x.id===id);if(p) p.start=v}),{quiet:true})}
    else{const v=el.value.trim()||'Участник';commit('Имя изменено',()=>Persist.settings(s=>{const p=s.people.find(x=>x.id===id);if(p) p.name=v}),{quiet:true})}
    schedule();return;
  }
  if(el.dataset&&el.dataset.set){
    const k=el.dataset.set;let v=el.type==='checkbox'?el.checked:el.value;
    if(k==='eMan'){v=String(v).trim()===''?0:parseAmount(v);if(!isFinite(v)||v<0){toast('Сумма введена неверно');v=0}}
    if(k==='startDate'&&!/^\d{4}-\d{2}-\d{2}$/.test(el.value)){el.value=state.settings.startDate;return}
    commit('Настройки изменены',()=>Persist.settings(s=>{s[k]=v}),{quiet:true});render(true);
  }
});
/* keyboard */
function payNext(){
  const M=lastModel;if(!M) return;
  let it=null;
  for(const m of M.months){for(const x of m.items){if(x.status==='plan'){it=x;break}}if(it) break}
  if(!it) return toast('Плановых платежей нет');
  act.pay({dataset:{k:it.key}});
}
document.addEventListener('keydown',e=>{
  if(ui.capturing){
    e.preventDefault();e.stopPropagation();
    if(e.code==='Escape'){ui.capturing=null;render(true);return}
    const c=comboFromEvent(e);if(!c) return;
    const cur2=ACTIONS.find(x=>x.id===ui.capturing),ctx=cur2.ctx||'page';
    const other=ACTIONS.find(a=>a.id!==ui.capturing&&(a.ctx||'page')===ctx&&keyOf(a)===c);
    if(other){toast('Это сочетание занято: '+other.label);return}
    if(c===cur2.def) delete prefs.keys[cur2.id];else prefs.keys[cur2.id]=c;
    savePrefs();ui.capturing=null;toast('Сохранено: '+comboLabel(c));render(true);return;
  }
  const modalOpen=!$('#modal').hidden,t=e.target,tag=(t&&t.tagName)||'';
  const inField=t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(tag));
  const c=comboFromEvent(e);
  if(modalOpen){
    if(e.key==='Escape'){closeSheet();return}
    const prim=$('#sheet [data-primary]');
    const saveKey=c&&ACTIONS.some(a=>a.ctx==='modal'&&keyOf(a)===c)&&!/^(BUTTON|TEXTAREA|A)$/.test(tag);
    if(prim&&(c==='Ctrl+Enter'||saveKey)){e.preventDefault();prim.click()}
    return;
  }
  if(e.key==='Enter'&&t&&t.id&&/^c-add-/.test(t.id)){e.preventDefault();const b=t.parentNode.querySelector('[data-act="cat-add"]');if(b) b.click();return}
  if(e.key==='Enter'&&t&&/^o-(bal|name|date)$/.test(t.id||'')){e.preventDefault();const b=$('[data-act="setup"]');if(b) b.click();return}
  if(inField) return;
  if(!state.active||!state.dataReady||!state.settings.ready||!c) return;
  if((c==='Enter'||c==='Space')&&/^(BUTTON|A|SUMMARY)$/.test(tag)) return;
  const a=ACTIONS.find(x=>(x.ctx||'page')==='page'&&keyOf(x)===c);if(!a) return;
  e.preventDefault();
  if(a.tab) return setTab(a.tab);
  const ids=()=>sortedProfiles().map(p=>p.id);
  const run={
    add:()=>act.add(),addEnter:()=>act.add(),addRec:()=>act['rec-new'](),addDebt:()=>act['debt-new'](),payNext,undo,redo,
    prev:()=>shiftMonth(-1),next:()=>shiftMonth(1),today:()=>{ui.month=ym(todayISO());render(true)},
    filter:()=>{if(ui.tab==='days'){const f=['all','plan','fact'];ui.filter=f[(f.indexOf(ui.filter)+1)%3];render(true)}},
    scope:()=>{if(!multi()||prefs.hide) return;const l=['all'].concat(people().map(p=>p.id));ui.scope=l[(l.indexOf(curScope())+1)%l.length];render(true)},
    hide:()=>act.hide(),profiles:()=>openProfiles(),
    profNext:()=>{const l=ids();if(l.length>1) switchTo(l[(l.indexOf(state.active)+1)%l.length])},
    export:()=>doExport(false),import:()=>$('#imp-file').click(),help:()=>openHelp(),
    tabPrev:()=>setTab(TABS[(TABS.indexOf(ui.tab)+TABS.length-1)%TABS.length]),
    tabNext:()=>setTab(TABS[(TABS.indexOf(ui.tab)+1)%TABS.length])
  };
  (run[a.id]||(()=>{}))();
});
function openHelp(){
  fs={kind:'help'};
  openSheet('Горячие клавиши','<div class="form"><div>'+ACTIONS.map(a=>'<div class="keyrow"><span>'+esc(a.label)+'</span><kbd>'+esc(comboLabel(keyOf(a)))+'</kbd></div>').join('')+'</div><p class="s">Изменить сочетания можно на вкладке «Ещё».</p></div>','<div class="actions"><span class="grow"></span><button class="btn" type="button" data-act="close">Закрыть</button></div>');
}
/* swipe between months (touch) */
(function(){
  let x0=0,y0=0,on=false;
  const m=$('#main');
  m.addEventListener('touchstart',e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;on=(ui.tab==='home'||ui.tab==='days')&&e.touches.length===1&&!e.target.closest('.chartwrap,.tablewrap,.seg')},{passive:true});
  m.addEventListener('touchend',e=>{
    if(!on) return;on=false;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)>80&&Math.abs(dy)<40) shiftMonth(dx<0?1:-1);
  },{passive:true});
})();
/* drag and drop import */
(function(){
  let depth=0;const ov=$('#dropall');
  const hasFiles=e=>e.dataTransfer&&[...(e.dataTransfer.types||[])].indexOf('Files')>=0;
  window.addEventListener('dragenter',e=>{if(!hasFiles(e)) return;e.preventDefault();depth++;ov.hidden=false});
  window.addEventListener('dragover',e=>{if(!hasFiles(e)) return;e.preventDefault()});
  window.addEventListener('dragleave',e=>{if(!hasFiles(e)) return;depth=Math.max(0,depth-1);if(!depth) ov.hidden=true});
  window.addEventListener('drop',e=>{if(!hasFiles(e)) return;e.preventDefault();depth=0;ov.hidden=true;const f=e.dataTransfer.files&&e.dataTransfer.files[0];handleFile(f)});
})();

Object.assign(act,SYNC_ACT);
boot();
})();
</script>

<script>if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
